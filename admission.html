<!DOCTYPE html>
<!-- BWBC Admission v0.6 2026-11-19 評分畫面：評語自動換行長高、分數欄縮窄、計算值固定小數位；評分表與委員範本合併為一份（加權總分自動計算）、Excel 列高交給 Excel 自動調整；書審彙整：書審成績與排名、門檻判定、研究類型定案、鎖定／解鎖、書審總表（Excel／列印）、報名系統回填檢核清單；v0.5：書審備註移到最後一欄（評分表 Excel／列印／評分畫面，Excel 版面依承辦人修訂版）；書審評分：成績表格（依委員／依考生、逐格自動儲存、Excel 貼上）、匯入委員 Excel（欄位對應、新舊逐格比對）；v0.4：2026-11-19 套用開發規範：權限 key、Magic Link 導回、刪改驗證筆數、梯次依日期預設、拖曳限把手、匯入逐欄選擇；v0.3：2026-11-19 評分用表與委員 Excel 範本 -->
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>招生作業 · 福智佛教學院</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* ════ 以下 CSS 複製自 admin.html（第 13–382 行），維持兩頁外觀一致；admin.html 改樣式時請同步 ════ */
:root{
  --navy:#1B3A6B;--navy2:#2B5FA0;--navy3:#EEF2FA;
  --gold:#B8892A;--gold2:#D4A84B;
  --ink:#1A1510;--ink2:#3A3020;--ink3:#6A5F4A;
  --cr:#F5F5F5;--cr2:#E8E8E8;--cr3:#F0F0F0;
  --green:#1A6A30;--red:#C04030;--orange:#B05010;
  --r:8px;--sh:0 2px 8px rgba(0,0,0,.08);--sh2:0 8px 24px rgba(0,0,0,.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',sans-serif;background:var(--cr);color:var(--ink);height:100vh;overflow:hidden;font-size:14px}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit;font-size:14px}

/* ── LOGIN ── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0F2045,#1B3A6B)}
.login-box{background:#fff;border-radius:16px;padding:40px;width:360px;box-shadow:var(--sh2)}
.login-logo{font-family:'Noto Serif TC',serif;font-size:20px;font-weight:600;color:var(--navy);text-align:center;margin-bottom:6px}
.login-sub{font-size:12px;color:var(--ink3);text-align:center;margin-bottom:28px}
.login-label{display:block;font-size:12px;font-weight:500;color:var(--ink3);margin-bottom:5px}
.login-input{width:100%;border:1.5px solid var(--cr2);border-radius:var(--r);padding:10px 12px;font-size:14px;transition:border-color .15s}
.login-input:focus{outline:none;border-color:var(--navy2)}
.login-btn{width:100%;margin-top:12px;background:var(--navy);color:#fff;border:none;border-radius:var(--r);padding:11px;font-size:14px;font-weight:500;transition:background .15s}
.login-btn:hover{background:var(--navy2)}

/* ── LAYOUT ── */
.app{display:none;height:100vh;flex-direction:column;overflow:hidden}
.app.show{display:flex}
.topbar{background:var(--navy);padding:0 24px;height:52px;display:flex;align-items:center;gap:16px;flex-shrink:0}
.tb-logo{font-family:'Noto Serif TC',serif;font-size:14px;color:rgba(255,255,255,.8);flex:1}
.tb-user{font-size:12px;color:rgba(255,255,255,.6)}
.tb-logout{font-size:12px;padding:4px 12px;border:1px solid rgba(255,255,255,.25);border-radius:4px;background:transparent;color:rgba(255,255,255,.7)}
.tb-logout:hover{background:rgba(255,255,255,.1)}
.sidebar-toggle-btn{background:transparent;border:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.85);width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
.sidebar-toggle-btn:hover{background:rgba(255,255,255,.15)}

.layout{display:flex;flex:1;overflow:hidden}
.sidebar{width:200px;background:#fff;border-right:1px solid var(--cr2);flex-shrink:0;height:100%;display:flex;flex-direction:column;overflow:hidden;transition:width .18s ease}
.sidebar-nav-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 0}
.sidebar-footer{flex-shrink:0;padding:10px 14px;border-top:1px solid var(--cr2);font-size:11px;color:var(--ink3);cursor:pointer;text-align:center;line-height:1.7}
.sidebar-footer:hover{background:var(--cr3)}
.nav-section{margin-bottom:16px}
.nav-label{font-size:10px;font-weight:500;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase;padding:0 16px;margin-bottom:4px;white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 16px;font-size:13px;color:var(--ink2);cursor:pointer;transition:all .15s;border-left:3px solid transparent;overflow:hidden;white-space:nowrap}
.nav-item:hover{background:var(--cr3);color:var(--ink)}
.nav-item.on{background:var(--navy3);color:var(--navy);border-left-color:var(--gold);font-weight:500}
.nav-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
/* 側邊欄收合：文字用font-size:0藏起來(而非只靠overflow裁切，避免文字露出一小截)，圖示在.nav-icon上另外指定字級蓋回來 */
.sidebar.collapsed{width:56px}
.sidebar.collapsed .nav-label,
.sidebar.collapsed .sidebar-footer,
.sidebar.collapsed .badge,
.sidebar.collapsed #sched-arrow{display:none}
.sidebar.collapsed .nav-item{justify-content:center !important;padding:9px 0;font-size:0}
.sidebar.collapsed .nav-item .nav-icon{font-size:16px}
.sidebar.collapsed #schedule-submenu{display:none !important}

.content{flex:1;overflow-y:auto;padding:20px 24px;min-width:0;height:100%}

/* ── CARDS ── */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:#fff;border-radius:var(--r);padding:14px 16px;border:1px solid var(--cr2);box-shadow:var(--sh)}
.tl-section-label{font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:.05em;margin:10px 0 6px;border-bottom:1px solid var(--cr2);padding-bottom:4px}
.tl-section-label:first-child{margin-top:0}
.tl-item{padding:4px 0;font-size:13px;line-height:1.5}
.tl-done{color:var(--ink3)}
.tl-done strong{color:var(--ink2);font-weight:500}
.tl-now{background:var(--navy3);color:var(--navy);font-weight:600;padding:8px 10px;border-radius:6px;margin:2px 0}
.tl-soon{color:var(--orange)}
.tl-soon strong{color:var(--ink);font-weight:600}
.tl-done-wrap summary::-webkit-details-marker{display:none}
.tl-done-wrap summary{list-style:none}
.tl-done-wrap[open] summary{margin-bottom:2px}
.payroll-toggle-summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--navy);list-style:none;user-select:none;display:flex;align-items:center;gap:6px}
.payroll-toggle-summary::-webkit-details-marker{display:none}
.payroll-toggle-arrow{display:inline-block;transition:transform .15s}
details:not([open]) .payroll-toggle-arrow{transform:rotate(-90deg)}
.payroll-card-summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;user-select:none}
.payroll-card-summary::-webkit-details-marker{display:none}
.viewer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}
.viewer-box{background:#fff;border-radius:10px;width:100%;max-width:960px;height:90vh;display:flex;flex-direction:column;overflow:hidden}
.viewer-hdr{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--navy);color:#fff;font-size:13px}
.viewer-hdr button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px}
.viewer-frame{flex:1;border:none;width:100%}
.stat-num{font-family:'Noto Serif TC',serif;font-size:28px;font-weight:600;color:var(--navy)}
.stat-lbl{font-size:11.5px;color:var(--ink3);margin-top:2px}

/* ── PAGE HEADER ── */
.page-hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.page-title{font-family:'Noto Serif TC',serif;font-size:18px;font-weight:600;flex:1}
.badge{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:500}
.badge-warn{background:#FFF3E0;color:#B05010;border:1px solid #F0C080}
.badge-ok{background:#E8F5E9;color:#1A6A30;border:1px solid #90D090}

/* ── TABLE ── */
.tbl-wrap{background:#fff;border-radius:var(--r);border:1px solid var(--cr2);overflow:auto;max-height:calc(100vh - 160px);box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;min-width:700px;font-size:13px}
thead{position:sticky;top:0;z-index:2}
thead tr{background:var(--navy)}
th{padding:9px 12px;text-align:left;font-weight:500;color:#fff;font-size:11.5px;letter-spacing:.04em;white-space:nowrap;background:var(--navy)}
tbody tr{border-bottom:1px solid var(--cr2);transition:background .15s}
tbody tr:hover{background:var(--cr3)}
td{padding:8px 10px;color:var(--ink2);vertical-align:middle}
td.mono{font-family:monospace;font-size:12px;color:var(--ink3)}

/* ── BUTTONS ── */
.btn{padding:6px 14px;border-radius:6px;font-size:12.5px;font-weight:500;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.btn-pri{background:var(--navy);color:#fff}.btn-pri:hover{background:var(--navy2)}
.btn-sm{padding:4px 10px;font-size:11.5px}
.btn-edit{background:var(--navy3);color:var(--navy);border:1px solid rgba(43,95,160,.2)}.btn-edit:hover{background:var(--navy);color:#fff}
.btn-del{background:#FEE;color:var(--red);border:1px solid #FCC}.btn-del:hover{background:var(--red);color:#fff}
.btn-save{background:var(--green);color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:12.5px;font-weight:500;cursor:pointer}.btn-save:hover{opacity:.85}
.btn-cancel{background:var(--cr2);color:var(--ink2);border:none;border-radius:6px;padding:6px 14px;font-size:12.5px;cursor:pointer}.btn-cancel:hover{background:var(--cr)}
.btn-sec{background:var(--cr2);color:var(--ink2)}.btn-sec:hover{background:var(--cr)}
.btn-gold{background:var(--gold);color:#fff}.btn-gold:hover{background:var(--gold2)}
.btn-copy{background:#E8F5E9;color:var(--green);border:1px solid #90D090}.btn-copy:hover{background:var(--green);color:#fff}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
input.search{padding:7px 12px;border:1.5px solid var(--cr2);border-radius:6px;font-size:13px;width:220px}
input.search:focus{outline:none;border-color:var(--navy2)}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:60px 16px;overflow-y:auto}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:12px;width:100%;max-width:600px;box-shadow:var(--sh2)}
.modal-hdr{padding:18px 22px 14px;border-bottom:1px solid var(--cr2);display:flex;align-items:center}
.modal-title{font-family:'Noto Serif TC',serif;font-size:16px;font-weight:600;flex:1}
.modal-close{font-size:20px;background:none;border:none;color:var(--ink3);padding:4px 8px;border-radius:6px}
.modal-close:hover{background:var(--cr2)}
.modal-body{padding:20px 22px}
.modal-footer{padding:14px 22px;border-top:1px solid var(--cr2);display:flex;justify-content:flex-end;gap:8px}

/* ── FORM ── */
.frow{margin-bottom:14px}
.frow-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.flabel{display:block;font-size:12px;font-weight:500;color:var(--ink3);margin-bottom:4px}
.finput,.fselect{width:100%;border:1.5px solid var(--cr2);border-radius:6px;padding:8px 10px;font-size:13px;background:#fff;transition:border-color .15s}
.finput:focus,.fselect:focus{outline:none;border-color:var(--navy2)}
.fro{color:var(--ink3);background:var(--cr3);cursor:default}

/* Teacher chips in modal */
.teacher-chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1.5px solid var(--cr2);border-radius:6px;min-height:42px;background:#fff}
.tchip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;background:var(--navy3);color:var(--navy);font-size:12px;border:1px solid rgba(43,95,160,.2)}
.tchip-del{font-size:14px;cursor:pointer;opacity:.5;background:none;border:none;color:inherit;padding:0;line-height:1}
.tchip-del:hover{opacity:1}
.teacher-add-row{display:flex;gap:6px;margin-top:8px}
.teacher-add-row select{flex:1}
.teacher-role-badge{font-size:10px;padding:1px 6px;border-radius:4px;background:rgba(43,95,160,.1);color:var(--navy);margin-left:2px}

/* ── SYLLABUS ── */
.sy-modal{position:fixed;inset:0;z-index:150;background:#F5F5F3;overflow-y:auto;display:none}
.sy-topbar{position:sticky;top:0;background:var(--navy);color:#fff;padding:11px 24px;display:flex;align-items:center;gap:12px;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.sy-body{max-width:900px;margin:0 auto;padding:20px 24px 60px}
.sy-section{background:#fff;border-radius:var(--r);border:1px solid var(--cr2);margin-bottom:16px;overflow:hidden}
.sy-section-hdr{padding:12px 18px;border-bottom:1px solid var(--cr2);display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.sy-section-title{font-family:'Noto Serif TC',serif;font-size:14px;font-weight:600;flex:1}
.sy-section-body{padding:16px 18px}
.sy-row{display:grid;gap:8px;margin-bottom:8px;align-items:start}
.sy-row-3{grid-template-columns:1fr 80px 1fr 32px}
.sy-row-2{grid-template-columns:32px 1fr 32px}
.sy-row-week{grid-template-columns:48px 1fr 1fr 28px}
.sy-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sy-info-item{font-size:13px;color:var(--ink3)}.sy-info-val{color:var(--ink);font-weight:500}
.sy-add-btn{width:100%;padding:7px;border:1.5px dashed var(--cr2);border-radius:var(--r);background:transparent;color:var(--ink3);font-size:12.5px;cursor:pointer;margin-top:4px;transition:all .15s}
.sy-add-btn:hover{border-color:var(--navy2);color:var(--navy)}
.week-row{border-bottom:1px solid var(--cr2);padding:8px 0}
.week-row:last-child{border-bottom:none}
.week-expand{background:none;border:none;cursor:pointer;font-size:16px;color:var(--ink3);padding:2px 6px;transition:transform .2s}
.week-detail{display:block;padding-top:8px}

/* Sortable headers */
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
th.sortable:hover{background:var(--navy2)}
.sort-icon{font-size:11px;opacity:.5;margin-left:3px}
th.sort-asc .sort-icon{opacity:1;color:var(--gold2)}
th.sort-desc .sort-icon{opacity:1;color:var(--gold2)}
.stu-th{padding:8px 10px;text-align:left;font-size:12px;font-weight:500;cursor:pointer;user-select:none;transition:background .15s;color:#fff;background:var(--navy)}
.usr-th{padding:10px 14px;text-align:left;font-size:12.5px;font-weight:500;cursor:pointer;user-select:none;transition:background .15s;color:#fff}
.sticky-thead th, .sticky-thead-th{position:sticky;top:0;background:var(--navy);z-index:2}
.usr-th:hover{background:var(--navy2)}

/* 4 級權限 radio group */
.perm-row{display:grid;grid-template-columns:1.3fr 2fr;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--cr2)}
.perm-row:last-child{border-bottom:none}
.perm-row .perm-label{font-size:13px;color:var(--ink)}
.perm-row .perm-items{font-size:11px;color:var(--ink3);margin-top:2px;line-height:1.5}
.perm-row .perm-levels{display:flex;gap:2px;background:#fff;border-radius:6px;padding:2px;border:1px solid var(--cr2)}
.perm-row .perm-levels label{flex:1;text-align:center;padding:4px 8px;font-size:12px;cursor:pointer;border-radius:4px;transition:all .15s;color:var(--ink3);font-weight:500}
.perm-row .perm-levels label.lv-none.on{background:#E0E0E0;color:#555}
.perm-row .perm-levels label.lv-read.on{background:#E3F2FD;color:#1565C0}
.perm-row .perm-levels label.lv-write.on{background:#E8F5E9;color:#1A6A30}
.perm-row .perm-levels label.lv-admin.on{background:#FFF3E0;color:#B05010}
.perm-row .perm-levels label:hover{background:rgba(0,0,0,.04)}
.perm-row .perm-levels label.on:hover{background:none}
.stu-th:hover{background:var(--navy2)}
.stu-avatar{width:36px;height:36px;border-radius:50%;background:var(--cr3);object-fit:cover;display:block;text-align:center;line-height:36px;font-size:11px;color:var(--ink3);font-weight:500}
.stu-status-badge{display:inline-block;font-size:11px;padding:2px 10px;border-radius:12px;font-weight:500}
.stu-status-active{background:#E8F5E9;color:#1A6A30}
.stu-status-pending{background:#F3E5F5;color:#7B1FA2}
.stu-status-leave{background:#FFF3E0;color:#B05010}
.stu-status-graduated{background:#E3F2FD;color:#1565C0}
.stu-status-withdrawn{background:#FCE4EC;color:#C2185B}
.stu-status-deceased{background:#ECEFF1;color:#455A64}
.stu-status-deferred{background:#ECEFF1;color:#455A64}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:500;z-index:200;display:none;align-items:center;gap:8px;box-shadow:var(--sh2);animation:slideIn .3s ease}
.toast.show{display:flex}
.toast.success{background:#1A6A30;color:#fff}
.toast.error{background:var(--red);color:#fff}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── TIMETABLE ── */
.tt-wrap{overflow-x:auto}
.tt-grid{border:1px solid var(--cr2);border-radius:var(--r);overflow:hidden;min-width:640px}
.tt-header{display:grid;grid-template-columns:52px repeat(5,1fr);background:var(--navy)}
.tt-header-cell{padding:8px 4px;text-align:center;font-size:12px;font-weight:500;color:#fff;border-right:1px solid rgba(255,255,255,.1)}
.tt-header-cell:last-child{border-right:none}
.tt-body{display:grid;grid-template-columns:52px repeat(5,1fr)}
.tt-time-col{border-right:1px solid var(--cr2);background:var(--cr3)}
.tt-time-cell{height:30px;display:flex;align-items:flex-start;padding:2px 5px 0;font-size:9.5px;color:var(--ink3);border-bottom:1px solid rgba(0,0,0,.04)}
.tt-time-cell.hr{border-bottom:1px solid var(--cr2)}
.tt-day-col{position:relative;border-right:1px solid var(--cr2)}
.tt-day-col:last-child{border-right:none}
.tt-slot{height:30px;border-bottom:1px solid rgba(0,0,0,.04)}
.tt-slot.hr{border-bottom:1px solid var(--cr2)}
.tt-block{position:absolute;left:2px;right:2px;border-radius:5px;padding:4px 6px;overflow:hidden;font-size:11px;line-height:1.3;z-index:2;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.1);transition:filter .1s}
.tt-block:hover{filter:brightness(.93)}
#tt-popup{pointer-events:auto}
.tt-block-hdr{display:flex;align-items:flex-start;gap:2px;margin-bottom:1px}
.tt-block-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt-block-credit{font-size:9px;padding:1px 4px;border-radius:3px;background:rgba(0,0,0,.10);white-space:nowrap;margin-left:2px;flex-shrink:0;line-height:1.6;align-self:flex-start}
.tt-block-sub{font-size:10px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt-block-room{font-size:9.5px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.tt-week-tag{font-size:9px;padding:1px 4px;border-radius:3px;background:rgba(0,0,0,.12);white-space:nowrap;flex-shrink:0;margin-right:2px;line-height:1.6}
.tt-badge{display:inline-flex;align-items:center;font-size:9px;flex-shrink:0}

// 今天（本地時間）的 yyyy-mm-dd，手動拼字串，不經過 toISOString（規則 37）
function todayStr(){ const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
// 依日期判斷「目前進行中」的梯次（規則 46 的梯次版）：今天落在梯次重要日程的最早～最晚之間；都不在就取最接近的一個；沒有日程的梯次不參與
function getCurrentRoundByDate(rounds) {
  const today = todayStr(), toDay = s => Date.parse(s) / 864e5, t = toDay(today);
  let best = null, bestDist = Infinity;
  (rounds || []).forEach(r => {
    const ds = Object.values(normalizeKeyDates(r.key_dates)).filter(v => /^\d{4}-\d{2}-\d{2}$/.test(v || '')).sort();
    if (!ds.length) return;
    const lo = ds[0], hi = ds[ds.length - 1];
    const dist = (today >= lo && today <= hi) ? 0 : Math.min(Math.abs(toDay(lo) - t), Math.abs(toDay(hi) - t));
    if (dist < bestDist) { best = r; bestDist = dist; }
  });
  return best;
}
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e) {} }
// 刪除／更新後檢查實際影響筆數（troubleshooting 症狀 13）：RLS 擋住或條件對不上時 Supabase 不會報錯，只會回 0 筆
function assertRows(res, expect, what) {
  if (res.error) throw res.error;
  const n = (res.data || []).length;
  if (n < expect) throw new Error(`${what}：預期 ${expect} 筆，實際只影響 ${n} 筆（可能沒有權限，請重新整理後再試）`);
  return n;
}
function canWrite(){ return ME.level === 'write' || ME.level === 'admin'; }
function numOrNull(v){ if (v === '' || v == null) return null; const n = Number(v); return Number.isFinite(n) ? n : null; }
function fmtTime(ts){ if (!ts) return ''; const d = new Date(ts); return d.toLocaleString('zh-TW', { hour12:false }); }
function parseRoundCode(code){
  const m = /^(\d{3})-([12])$/.exec(String(code||'').trim());
  if (!m) return null;
  const year = Number(m[1]), term = Number(m[2]);
  return { year, term, track: TRACK_BY_TERM[term], name: `${year} 學年度${TRACK_BY_TERM[term]}` };
}

// 與 SQL 函式 adm_perm_level() 相同的判斷（前端只負責顯示，真正的把關在 RLS）

async function loadBase() {
  const [{ data: rounds, error: e1 }, { data: teachers, error: e2 }] = await Promise.all([
    sb.from('adm_rounds').select('*').order('code', { ascending: false }),
    sb.from('teachers').select('id,name_zh,active,teacher_type').order('name_zh'),
  ]);
  if (e1) { showToast('讀取梯次失敗：' + e1.message, 'error'); return; }
  if (e2) console.warn('讀取教師失敗', e2);
  ROUNDS = rounds || [];
  TEACHERS = teachers || [];
  renderRoundSelect();
  const saved = ssGet(SS_ROUND);
  const pick = ROUNDS.find(r => r.id === saved) || getCurrentRoundByDate(ROUNDS) || ROUNDS[0];
  if (pick) await selectRound(pick.id, true);
  else { CUR = null; renderPage(); }
}

function renderRoundSelect() {
  const sel = document.getElementById('round-sel');

    ? ROUNDS.map(r => `<option value="${r.id}">${esc(r.code)} · ${esc(r.name)}</option>`).join('')

async function selectRound(id, silent) {
  if (!id) return;
  if (DIRTY && !silent && !confirm('梯次設定有尚未儲存的修改，確定要切換梯次嗎？')) {
    document.getElementById('round-sel').value = CUR?.id || '';

  }
  await loadRound(id);
  ssSet(SS_ROUND, id);
  document.getElementById('round-sel').value = id;

async function loadRound(id) {
  const round = ROUNDS.find(r => r.id === id);
  if (!round) return;
  const [cr, rv, sc, ap] = await Promise.all([
    sb.from('adm_criteria').select('*').eq('round_id', id).order('stage').order('sort_order'),
    sb.from('adm_reviewers').select('*').eq('round_id', id).order('stage').order('sort_order'),
    sb.from('adm_scores').select('reviewer_id,criterion_id,applicant_id').eq('round_id', id).limit(10000),
    sb.from('adm_applicants').select('id', { count: 'exact', head: true }).eq('round_id', id),
  ]);
  if (cr.error || rv.error || sc.error) {
    showToast('讀取梯次資料失敗：' + (cr.error || rv.error || sc.error).message, 'error');
  }
  const criteria = cr.data || [];
  const stageOf = Object.fromEntries(criteria.map(c => [c.id, c.stage]));
  const scoresByStage = { review: 0, interview: 0 };
  const scoresByReviewer = {};
  const scoresByApplicant = {};
  (sc.data || []).forEach(s => {
    const st = stageOf[s.criterion_id];
    if (st) scoresByStage[st]++;
    scoresByReviewer[s.reviewer_id] = (scoresByReviewer[s.reviewer_id] || 0) + 1;
    scoresByApplicant[s.applicant_id] = (scoresByApplicant[s.applicant_id] || 0) + 1;
  });
  CUR = {
    ...round,
    criteria,
    reviewers: rv.data || [],
    scoresByStage, scoresByReviewer, scoresByApplicant,
    applicantCount: ap.count || 0,
  };
  DRAFT = null; DIRTY = false;
}

// key_dates 相容：seed 用 {interview:[d1,d2], review_period:[a,b], enroll:[a,b]}，畫面用扁平欄位
function normalizeKeyDates(k) {
  const o = { ...(k || {}) };
  if (Array.isArray(o.interview))     { o.interview_1 = o.interview[0] || ''; o.interview_2 = o.interview[1] || ''; delete o.interview; }
  if (Array.isArray(o.review_period)) { o.review_from = o.review_period[0] || ''; o.review_to = o.review_period[1] || ''; delete o.review_period; }
  if (Array.isArray(o.enroll))        { o.enroll_from = o.enroll[0] || ''; o.enroll_to = o.enroll[1] || ''; delete o.enroll; }
  return o;
}

function makeDraft() {
  const r = CUR;
  const d = {
    id: r.id, code: r.code, academic_year: r.academic_year, term: r.term, track: r.track, name: r.name,
    pass_threshold: r.pass_threshold, weight_review: r.weight_review, weight_interview: r.weight_interview,
    admit_quota: r.admit_quota, waitlist_max: r.waitlist_max, waitlist_min_score: r.waitlist_min_score,
    decimals: r.decimals, age_base_date: r.age_base_date || '', spread_alert: r.spread_alert,
    roster_mask_mode: r.roster_mask_mode, near_counties: [...(r.near_counties || [])],
    key_dates: normalizeKeyDates(r.key_dates),
    tie_breakers: Array.isArray(r.tie_breakers) ? [...r.tie_breakers] : [],
    criteria: r.criteria.map(c => ({ ...c })),
    reviewers: r.reviewers.map(v => ({ ...v })),
    _tieAutofilled: false,
  };
  // 尚未設定同分比序 → 預設依面試項目順序（簡章：學習動機 → 學習潛力），儲存後生效
  if (!d.tie_breakers.length) {
    const iv = d.criteria.filter(c => c.stage === 'interview' && c.id).sort((a,b) => a.sort_order - b.sort_order);
    if (iv.length) { d.tie_breakers = iv.map(c => 'criterion:' + c.id); d._tieAutofilled = true; }
  }
  return d;
}

/* ── 滑鼠拖拉排序（通用）：抓 .adm-drag 把手（或整個項目）拖到另一個項目上放開 ── */
function bindDrag(container, itemSel, onMove) {
  if (!container) return;
  let from = null;
  container.querySelectorAll(itemSel).forEach(el => {
    const handle = el.querySelector('.adm-drag') || el;
    handle.addEventListener('mousedown', () => { el.draggable = true; });
    el.addEventListener('dragstart', e => {
      from = Number(el.dataset.i);
      el.classList.add('adm-dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', String(from)); } catch (_) {}
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('adm-dragging');
      if (handle !== el) el.draggable = false;
      container.querySelectorAll('.adm-dropover').forEach(x => x.classList.remove('adm-dropover'));
      from = null;
    });
    el.addEventListener('dragover', e => { if (from === null) return; e.preventDefault(); el.classList.add('adm-dropover'); });
    el.addEventListener('dragleave', () => el.classList.remove('adm-dropover'));
    el.addEventListener('drop', e => {
      e.preventDefault();
      el.classList.remove('adm-dropover');
      const to = Number(el.dataset.i);
      if (from !== null && from !== to) onMove(from, to);
      from = null;
    });
  });
}

/* ── 欄位更新 ── */
function setD(k, v) { DRAFT[k] = v; markDirty(); }

/* ── 同分比序 ── */
function tieLabel(key) {
  if (key === 'interview_total') return '面試總成績';
  if (key === 'review_total') return '書審總成績';
  if (key === 'total') return '總成績';
  if (key.startsWith('criterion:')) {
    const c = DRAFT.criteria.find(x => x.id === key.slice(10));
    return c ? `${STAGE_ZH[c.stage]}・${c.name}` : '（已刪除的項目）';
  }
  return key;
}
function tieOptions() {
  const opts = ['interview_total', 'review_total'];
  DRAFT.criteria.filter(c => c.id).sort((a,b) => (a.stage===b.stage ? a.sort_order-b.sort_order : (a.stage==='interview'?-1:1)))
    .forEach(c => opts.push('criterion:' + c.id));
  return opts.filter(o => !DRAFT.tie_breakers.includes(o));
}
function renderTieBreakers() {
  const box = document.getElementById('tie-box'); if (!box) return;
  const ro = !canWrite(), t = DRAFT.tie_breakers;
  const chips = t.map((k, i) => `<span class="tchip" data-i="${i}">${ro ? '' : '<span class="adm-drag" style="font-size:13px" title="按住拖拉調整順序">⠿</span>'}${i+1}. ${esc(tieLabel(k))}
      ${ro ? '' : `<button class="tchip-del" title="移除" onclick="removeTie(${i})">×</button>`}</span>`).join('<span style="color:var(--ink3)">→</span>');
  const opts = tieOptions();
  box.innerHTML = `<div class="adm-tie">${chips || '<span class="adm-hint">尚未設定</span>'}
    ${ro || !opts.length ? '' : `<select class="fselect" style="width:auto" onchange="if(this.value){addTie(this.value)}">
      <option value="">＋ 加入比序項目</option>${opts.map(o => `<option value="${esc(o)}">${esc(tieLabel(o))}</option>`).join('')}</select>`}
  </div>
  <div class="adm-hint">錄取依總成績排序；總成績相同時依上列順序比較。${ro ? '' : '按住 ⠿ 拖拉可調整先後。'}新增的評分項目要先儲存，才會出現在選單中。${DRAFT._tieAutofilled ? '<br>目前顯示的是依面試項目順序預填的建議，按「儲存梯次設定」後生效。' : ''}</div>`;
  if (!ro) bindDrag(box.querySelector('.adm-tie'), '.tchip[data-i]', reorderTie);
}
function addTie(k) { DRAFT.tie_breakers.push(k); DRAFT._tieAutofilled = false; markDirty(); renderTieBreakers(); }
function removeTie(i) { DRAFT.tie_breakers.splice(i, 1); DRAFT._tieAutofilled = false; markDirty(); renderTieBreakers(); }
function reorderTie(from, to) { moveItem(DRAFT.tie_breakers, from, to); DRAFT._tieAutofilled = false; markDirty(); renderTieBreakers(); }

/* ── 評分項目 ── */
function stageHasScores(st) { return (CUR.scoresByStage[st] || 0) > 0; }
function renderCriteria(st) {
  const box = document.getElementById('crit-' + st); if (!box) return;
  const locked = stageHasScores(st), ro = !canWrite() || locked;

  renderCritSum(st);
  if (!ro) bindDrag(box.querySelector('tbody'), 'tr[data-i]', (from, to) => reorderCrit(st, from, to));

function renderCritSum(st) {
  const el = document.getElementById('crit-sum-' + st); if (!el) return;
  const s = DRAFT.criteria.filter(c => c.stage === st).reduce((a, c) => a + Number(c.weight || 0), 0);
  el.innerHTML = s === 100 ? '<span class="adm-ok">權重合計 100% ✓</span>' : `<span class="adm-bad">權重合計 ${s}%，必須是 100%</span>`;
}
function setCrit(idx, k, v) { DRAFT.criteria[idx][k] = v; markDirty(); if (k === 'weight') renderCritSum(DRAFT.criteria[idx].stage); }
function addCrit(st) {
  const list = DRAFT.criteria.filter(c => c.stage === st);
  DRAFT.criteria.push({ stage: st, name: '', weight: 0, sort_order: list.length ? Math.max(...list.map(c => c.sort_order)) + 1 : 1 });
  markDirty(); renderCriteria(st);
}
function removeCrit(idx) {
  const c = DRAFT.criteria[idx];
  DRAFT.criteria.splice(idx, 1);
  if (c.id) DRAFT.tie_breakers = DRAFT.tie_breakers.filter(k => k !== 'criterion:' + c.id);
  markDirty(); renderCriteria(c.stage); renderTieBreakers();
}
function reorderCrit(st, from, to) {
  const list = DRAFT.criteria.filter(c => c.stage === st).sort((a,b) => a.sort_order - b.sort_order);
  moveItem(list, from, to).forEach((c, k) => { c.sort_order = k + 1; });
  markDirty(); renderCriteria(st);
}

/* ── 委員 ── */
function reviewerName(v) {

      .filter(t => t.id === cur || (t.active !== false && !used.has(t.id)))

      <tbody>${list.map((v, i) => {

          <td>${ro ? '' : '<span class="adm-drag" title="拖拉調整順序">⠿</span>'}${i+1}</td>

    </table></div>
    ${ro ? '' : `<button class="sy-add-btn" onclick="addRev('${st}')">＋ 新增委員</button>`}

  if (!ro) bindDrag(box.querySelector('tbody'), 'tr[data-i]', (from, to) => reorderRev(st, from, to));

function setRev(idx, k, v) { DRAFT.reviewers[idx][k] = v; markDirty(); }
function setRevTeacher(idx, tid) {
  const v = DRAFT.reviewers[idx];
  v.teacher_id = tid || null;
  if (tid) v.external_name = null;
  markDirty(); renderReviewers(v.stage);
}
function nextCode(list) {
  const used = new Set(list.map(v => v.code));
  for (let i = 0; i < 26; i++) { const ch = String.fromCharCode(65 + i); if (!used.has(ch)) return ch; }
  return '';
}
function addRev(st) {
  const list = DRAFT.reviewers.filter(v => v.stage === st);
  DRAFT.reviewers.push({ stage: st, teacher_id: null, external_name: '', code: nextCode(list),
    sort_order: list.length ? Math.max(...list.map(v => v.sort_order)) + 1 : 1 });
  markDirty(); renderReviewers(st);
}
function removeRev(idx) { const st = DRAFT.reviewers[idx].stage; DRAFT.reviewers.splice(idx, 1); markDirty(); renderReviewers(st); }
function reorderRev(st, from, to) {
  const list = DRAFT.reviewers.filter(v => v.stage === st).sort((a,b) => a.sort_order - b.sort_order);
  moveItem(list, from, to).forEach((v, k) => { v.sort_order = k + 1; });
  markDirty(); renderReviewers(st);
}
function copyReviewersToInterview() {
  const iv = DRAFT.reviewers.filter(v => v.stage === 'interview');
  if (iv.some(v => v.id && CUR.scoresByReviewer[v.id])) { showToast('面試委員已有分數，不能整批更換', 'error'); return; }
  if (iv.length && !confirm('會以書審委員取代目前的面試委員名單，確定嗎？')) return;
  DRAFT.reviewers = DRAFT.reviewers.filter(v => v.stage !== 'interview');
  DRAFT.reviewers.filter(v => v.stage === 'review').sort((a,b) => a.sort_order - b.sort_order).forEach((v, k) => {
    DRAFT.reviewers.push({ stage: 'interview', teacher_id: v.teacher_id, external_name: v.external_name, code: v.code, sort_order: k + 1 });
  });
  markDirty(); renderReviewers('interview');
}

function discardDraft() {
  if (DIRTY && !confirm('確定放棄所有未儲存的修改？')) return;
  DRAFT = null; DIRTY = false; renderRoundsPage();
}

/* ── 驗證與儲存 ── */
function validateDraft() {
  const d = DRAFT, errs = [];
  if (!String(d.name || '').trim()) errs.push('名稱不可空白');
  if (Number(d.weight_review || 0) + Number(d.weight_interview || 0) !== 100) errs.push('總成績 a＋b 必須是 100%');
  if (d.pass_threshold != null && (d.pass_threshold < 0 || d.pass_threshold > 100)) errs.push('門檻必須在 0～100');
  if (d.admit_quota == null || d.admit_quota < 0) errs.push('正取名額必須是 0 以上的整數');
  if (d.decimals == null || d.decimals < 0 || d.decimals > 4) errs.push('小數位數必須在 0～4');
  ['review','interview'].forEach(st => {
    const list = d.criteria.filter(c => c.stage === st);
    if (!list.length) errs.push(`${STAGE_ZH[st]}至少要有一個評分項目`);
    const sum = list.reduce((a, c) => a + Number(c.weight || 0), 0);
    if (list.length && Math.abs(sum - 100) > 0.001) errs.push(`${STAGE_ZH[st]}評分項目權重合計必須是 100%（目前 ${sum}%）`);
    const names = list.map(c => String(c.name || '').trim());
    if (names.some(n => !n)) errs.push(`${STAGE_ZH[st]}評分項目名稱不可空白`);
    if (new Set(names).size !== names.length) errs.push(`${STAGE_ZH[st]}評分項目名稱重複`);
    const revs = d.reviewers.filter(v => v.stage === st);
    if (revs.some(v => !v.teacher_id && !String(v.external_name || '').trim())) errs.push(`${STAGE_ZH[st]}委員有一列沒有選教師也沒有填姓名`);
    const tids = revs.map(v => v.teacher_id).filter(Boolean);
    if (new Set(tids).size !== tids.length) errs.push(`${STAGE_ZH[st]}委員重複`);
    const codes = revs.map(v => v.code).filter(Boolean);
    if (new Set(codes).size !== codes.length) errs.push(`${STAGE_ZH[st]}委員代號重複`);
  });
  // 書審鎖定後：門檻與書審委員不能改（會改變進入面試名單）
  if (CUR.review_locked_at) {
    if (Number(d.pass_threshold) !== Number(CUR.pass_threshold)) errs.push('書審已鎖定，不能修改書審門檻（請先到「書審彙整」解鎖）');
    const ids = r => r.filter(v => v.stage === 'review').map(v => v.id || 'new').sort().join(',');
    if (ids(d.reviewers) !== ids(CUR.reviewers)) errs.push('書審已鎖定，不能新增或刪除書審委員（請先到「書審彙整」解鎖）');
  }
  return errs;
}

async function saveRound() {
  if (!canWrite()) return;
  const errs = validateDraft();
  if (errs.length) { alert('無法儲存：\n\n・' + errs.join('\n・')); return; }
  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.textContent = '儲存中…';
  const d = DRAFT, id = CUR.id, changes = [];
  try {
    // 1. 梯次
    const roundRow = {
      name: d.name.trim(), pass_threshold: d.pass_threshold, weight_review: d.weight_review, weight_interview: d.weight_interview,
      admit_quota: d.admit_quota, waitlist_max: d.waitlist_max, waitlist_min_score: d.waitlist_min_score,
      decimals: d.decimals, age_base_date: d.age_base_date || null, spread_alert: d.spread_alert ?? 15,
      roster_mask_mode: d.roster_mask_mode, near_counties: d.near_counties,
      key_dates: Object.fromEntries(Object.entries(d.key_dates).filter(([, v]) => v)),
      tie_breakers: d.tie_breakers,
    };
    Object.keys(roundRow).forEach(k => {
      if (JSON.stringify(roundRow[k]) !== JSON.stringify(k === 'key_dates' ? normalizeKeyDates(CUR[k]) : CUR[k])) changes.push(k);
    });
    assertRows(await sb.from('adm_rounds').update(roundRow).eq('id', id).select('id'), 1, '更新梯次');

    // 2. 評分項目（有分數的階段不動）
    for (const st of ['review','interview']) {
      if (stageHasScores(st)) continue;
      const before = CUR.criteria.filter(c => c.stage === st);
      const after = d.criteria.filter(c => c.stage === st);
      const removed = before.filter(b => !after.some(a => a.id === b.id));
      if (removed.length) {
        assertRows(await sb.from('adm_criteria').delete().in('id', removed.map(c => c.id)).select('id'), removed.length, '刪除評分項目');
        changes.push(`刪除${STAGE_ZH[st]}項目：${removed.map(c => c.name).join('、')}`);
      }
      for (const c of after) {
        const row = { name: c.name.trim(), weight: c.weight, sort_order: c.sort_order, import_label: (c.import_label || '').trim() || null };
        if (c.id) {
          const old = before.find(b => b.id === c.id);
          if (old && (old.name !== row.name || Number(old.weight) !== Number(row.weight) || old.sort_order !== row.sort_order || (old.import_label || null) !== row.import_label)) {
            assertRows(await sb.from('adm_criteria').update(row).eq('id', c.id).select('id'), 1, '更新評分項目');
            changes.push(`修改${STAGE_ZH[st]}項目：${row.name}`);
          }
        } else {
          assertRows(await sb.from('adm_criteria').insert({ ...row, round_id: id, stage: st }).select('id'), 1, '新增評分項目');
          changes.push(`新增${STAGE_ZH[st]}項目：${row.name}`);
        }
      }
    }

    // 3. 委員（已有分數的委員不刪）
    const beforeR = CUR.reviewers, afterR = d.reviewers;
    const removedR = beforeR.filter(b => !afterR.some(a => a.id === b.id) && !CUR.scoresByReviewer[b.id]);
    if (removedR.length) {
      assertRows(await sb.from('adm_reviewers').delete().in('id', removedR.map(v => v.id)).select('id'), removedR.length, '刪除委員');
      changes.push(`刪除委員：${removedR.map(reviewerName).join('、')}`);
    }
    for (const v of afterR) {
      const row = { teacher_id: v.teacher_id || null, external_name: v.teacher_id ? null : (v.external_name || '').trim(),
                    code: (v.code || '').trim() || null, sort_order: v.sort_order };
      if (v.id) {
        const old = beforeR.find(b => b.id === v.id);
        if (old && (old.teacher_id !== row.teacher_id || (old.external_name || null) !== (row.external_name || null) || (old.code || null) !== row.code || old.sort_order !== row.sort_order)) {
          assertRows(await sb.from('adm_reviewers').update(row).eq('id', v.id).select('id'), 1, '更新委員');
          changes.push(`修改${STAGE_ZH[v.stage]}委員：${reviewerName({ ...v, ...row })}`);
        }
      } else {
        assertRows(await sb.from('adm_reviewers').insert({ ...row, round_id: id, stage: v.stage }).select('id'), 1, '新增委員');
        changes.push(`新增${STAGE_ZH[v.stage]}委員：${reviewerName({ ...v, ...row })}`);
      }
    }

    await writeAuditLog('招生', '修改梯次設定', 'adm_rounds', id, CUR.code, changes.join('；') || '（無變更）');
    showToast('✅ 梯次設定已儲存');
    DIRTY = false;
    const { data: fresh } = await sb.from('adm_rounds').select('*').eq('id', id).maybeSingle();
    if (fresh) ROUNDS = ROUNDS.map(r => r.id === id ? fresh : r);
    renderRoundSelect();
    await loadRound(id);
    renderRoundsPage();
  } catch (e) {
    console.error(e);
    showToast('儲存失敗：' + (e.message || e), 'error');
    btn.disabled = false; btn.textContent = '儲存梯次設定';
  }
}

function openNewRound() {

function previewNewRound() {
  const p = parseRoundCode(document.getElementById('nr-code').value);

  document.getElementById('nr-name').value = p ? p.name : '';
  if (!p) { msg.innerHTML = '<span class="adm-bad">格式：三位數學年度-學期，例如 116-2（-1＝甄試入學，-2＝考試入學）</span>'; return; }

async function createRound() {
  const code = document.getElementById('nr-code').value.trim();
  const p = parseRoundCode(code);
  if (!p) { previewNewRound(); return; }
  if (ROUNDS.some(r => r.code === code)) { previewNewRound(); return; }
  const fromId = document.getElementById('nr-from').value;
  const copyCrit = document.getElementById('nr-copy-criteria').checked;
  const copyRev = document.getElementById('nr-copy-reviewers').checked;
  const btn = document.getElementById('nr-btn');
  btn.disabled = true; btn.textContent = '建立中…';
  try {
    const src = ROUNDS.find(r => r.id === fromId);
    const row = { code, academic_year: p.year, term: p.term, track: p.track, name: p.name };
    if (src) Object.assign(row, {
      pass_threshold: src.pass_threshold, weight_review: src.weight_review, weight_interview: src.weight_interview,
      admit_quota: src.admit_quota, waitlist_max: src.waitlist_max, waitlist_min_score: src.waitlist_min_score,
      decimals: src.decimals, spread_alert: src.spread_alert, near_counties: src.near_counties,
      interview_settings: src.interview_settings, roster_mask_mode: src.roster_mask_mode,
    });
    const ins = await sb.from('adm_rounds').insert(row).select().single();
    if (ins.error) throw ins.error;
    const nr = ins.data;

    let tie = [];
    if (src && copyCrit) {
      const { data: crits, error } = await sb.from('adm_criteria').select('*').eq('round_id', src.id);
      if (error) throw error;
      if (crits?.length) {
        const r = await sb.from('adm_criteria').insert(crits.map(c => ({
          round_id: nr.id, stage: c.stage, name: c.name, weight: c.weight, max_score: c.max_score, sort_order: c.sort_order, import_label: c.import_label,
        }))).select();
        if (r.error) throw r.error;
        // 同分比序的項目 id 換成新梯次的 id（依階段＋名稱對應）
        const map = {};
        crits.forEach(o => { const n = r.data.find(x => x.stage === o.stage && x.name === o.name); if (n) map[o.id] = n.id; });
        tie = (src.tie_breakers || []).map(k => k.startsWith('criterion:') ? (map[k.slice(10)] ? 'criterion:' + map[k.slice(10)] : null) : k).filter(Boolean);
        if (tie.length) assertRows(await sb.from('adm_rounds').update({ tie_breakers: tie }).eq('id', nr.id).select('id'), 1, '複製同分比序');
      }
    }
    if (src && copyRev) {
      const { data: revs, error } = await sb.from('adm_reviewers').select('*').eq('round_id', src.id);
      if (error) throw error;
      if (revs?.length) {
        assertRows(await sb.from('adm_reviewers').insert(revs.map(v => ({
          round_id: nr.id, stage: v.stage, teacher_id: v.teacher_id, external_name: v.external_name, code: v.code, sort_order: v.sort_order,
        }))).select('id'), revs.length, '複製委員');
      }
    }
    await writeAuditLog('招生', '新增梯次', 'adm_rounds', nr.id, code, src ? `複製自 ${src.code}（評分項目：${copyCrit?'是':'否'}；委員：${copyRev?'是':'否'}）` : '使用預設值');
    closeModal('new-round-modal');
    showToast('✅ 已建立梯次 ' + code);
    const { data: rounds } = await sb.from('adm_rounds').select('*').order('code', { ascending: false });
    ROUNDS = rounds || [];
    renderRoundSelect();
    DIRTY = false;
    await selectRound(nr.id, true);
  } catch (e) {
    console.error(e);
    showToast('建立失敗：' + (e.message || e), 'error');
  } finally {
    btn.disabled = false; btn.textContent = '建立';
  }
}

async function deleteRound() {

/* ── 小工具 ── */
// 去掉空白與零寬字元（報名系統的「書面審查成績」欄名夾帶 U+200B），統一全半形括號
function normHdr(h) { return String(h == null ? '' : h).replace(/[\s\u200B-\u200D\uFEFF]+/g, '').replace(/（/g, '(').replace(/）/g, ')'); }
function cellStr(v) {
  if (v == null) return '';
  if (v instanceof Date) return toISODate(v);
  return String(v).trim();
}
function pad2(n) { return String(n).padStart(2, '0'); }
function toISODate(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
// 出生年月日：Excel 日期、Excel 序號、1980/1/2、1980-01-02、19800102、民國 69/1/2、69.01.02
function parseDateCell(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date && !isNaN(v)) return toISODate(new Date(v.getTime() + 12 * 3600 * 1000)); // 避開時區造成的前一天
  if (typeof v === 'number') {
    if (v > 19000000 && v < 21001231) { const s = String(v); return `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`; }
    if (v > 1000 && v < 80000) { const d = new Date(Date.UTC(1899, 11, 30) + v * 864e5); return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth()+1)}-${pad2(d.getUTCDate())}`; }
    return null;
  }
  const s = String(v).trim().replace(/[年月]/g, '/').replace(/日/g, '').replace(/[.\-]/g, '/');
  let m = /^(\d{2,4})\/(\d{1,2})\/(\d{1,2})$/.exec(s);
  if (!m && /^\d{8}$/.test(s)) m = [s, s.slice(0,4), s.slice(4,6), s.slice(6,8)];
  if (!m && /^\d{7}$/.test(s)) m = [s, s.slice(0,3), s.slice(3,5), s.slice(5,7)];
  if (!m) return null;
  let y = Number(m[1]); if (y < 1911) y += 1911;
  const mo = Number(m[2]), d = Number(m[3]);
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  return `${y}-${pad2(mo)}-${pad2(d)}`;
}
// 電話：報名系統手機是 886912345678 / +886912345678 格式 → 0912345678；Excel 吃掉開頭 0 的也補回
function phoneStr(v, mobile) {
  if (v == null || v === '') return '';
  let s = typeof v === 'number' ? String(Math.round(v)) : String(v).trim();
  const digits = s.replace(/[^\d]/g, '');
  if (/^886\d{8,9}$/.test(digits) && (s.startsWith('+') || s.startsWith('886') || typeof v === 'number')) s = '0' + digits.slice(3);
  if (mobile && /^9\d{8}$/.test(s)) s = '0' + s;
  return s;
}
function normGender(g) {
  const s = String(g || '').trim();
  if (/^(男|M|m|1)/.test(s)) return '男';
  if (/^(女|F|f|2)/.test(s)) return '女';
  return s;
}
function intOrNull(v) { const n = parseInt(String(v).replace(/[^\d]/g, ''), 10); return Number.isFinite(n) ? n : null; }

// 郵遞區號前 3 碼 → 縣市（地址沒寫縣市時用，例如「西區…」「彰化市…」）
const ZIP_COUNTY = [
  [100,118,'臺北市'],[200,206,'基隆市'],[207,208,'新北市'],[209,212,'連江縣'],[220,253,'新北市'],[260,272,'宜蘭縣'],
  [300,300,'新竹市'],[302,315,'新竹縣'],[320,338,'桃園市'],[350,369,'苗栗縣'],[400,439,'臺中市'],[500,530,'彰化縣'],
  [540,558,'南投縣'],[600,600,'嘉義市'],[602,625,'嘉義縣'],[630,655,'雲林縣'],[700,745,'臺南市'],[800,852,'高雄市'],
  [880,885,'澎湖縣'],[890,896,'金門縣'],[900,947,'屏東縣'],[950,966,'臺東縣'],[970,983,'花蓮縣'],
];
function countyFromZip(zip) {
  const z = parseInt(String(zip || '').replace(/[^\d]/g, '').slice(0, 3), 10);
  if (!Number.isFinite(z)) return null;
  const hit = ZIP_COUNTY.find(([a, b]) => z >= a && z <= b);
  return hit ? hit[2] : null;
}
// 通訊地址（＋郵遞區號）→ 縣市、鄉鎮市區
function splitAddress(addr, zip) {
  const a = String(addr || '').replace(/^\s*\d{3,6}\s*/, '').replace(/^台/, '臺').replace(/台(北|中|南|東)/g, '臺$1');
  let county = COUNTIES.find(c => a.startsWith(c)) || null;
  let rest = county ? a.slice(county.length) : a;
  if (!county) county = countyFromZip(zip) || COUNTIES.find(c => a.slice(0, 8).includes(c)) || null;
  if (county && !rest.length) rest = a;
  let township = null;
  const m = /^(.{1,3}?[鄉鎮市區])/.exec(rest);
  if (m && county) township = m[1];
  if (String(zip || '').startsWith('646')) township = '古坑鄉';   // 學校所在地
  return { county, township };
}
function ageOf(app) {
  const base = CUR.age_base_date || normalizeKeyDates(CUR.key_dates).apply_deadline;
  if (!app.birth_date || !base) return null;
  const days = (Date.parse(base) - Date.parse(app.birth_date)) / 864e5;
  return Math.round(days / 365.25 * 10) / 10;
}
function autoBackground(app) {
  const age = ageOf(app);
  const school = app.school_short || app.school_name || '';
  const dept = app.dept_name || '';
  return `${normGender(app.gender)}(${age == null ? '?' : age})${app.edu_level || ''} ${school}${dept ? '-' + dept : ''}`.trim();
}
function backgroundOf(app) { return (app.background_override || '').trim() || autoBackground(app); }
function placeOf(app) {
  if (!app.county) return { cls: '', text: '未知' };
  const gukeng = app.county === '雲林縣' && app.township === '古坑鄉';
  if ((CUR.near_counties || []).includes(app.county)) return { cls: 'near', text: app.county + (gukeng ? '（古坑）' : '') };
  return { cls: 'far', text: app.county + (gukeng ? '（古坑）' : '') };
}
function isEquivalent(app) { return /同等/.test(app.edu_qualification || ''); }

/* ── 欄位排序（通用）：點表頭排序，再點一次反向；數字依大小、文字依中文筆順／編號自然排序 ──
   用法：makeSortable(table, key) 在畫出表頭後呼叫；tbody 重畫後呼叫 applySort(table, key) */
const SORT_STATE = {};
function sortCellValue(td) {
  if (!td) return '';
  const v = td.dataset.sort != null ? td.dataset.sort : td.textContent.trim();
  return v;
}
function applySort(table, key) {
  const st = SORT_STATE[key]; if (!table) return;
  const ths = [...table.querySelectorAll('thead th')];
  ths.forEach((th, i) => {
    if (!th.classList.contains('sortable')) return;
    th.classList.toggle('sort-asc', !!st && st.i === i && st.dir === 1);
    th.classList.toggle('sort-desc', !!st && st.i === i && st.dir === -1);
    const ic = th.querySelector('.sort-icon'); if (ic) ic.textContent = (st && st.i === i) ? (st.dir === 1 ? '▲' : '▼') : '⇅';
  });
  if (!st) return;
  const tb = table.querySelector('tbody'); if (!tb) return;
  const rows = [...tb.querySelectorAll(':scope > tr')].filter(tr => tr.children.length > 1);
  const num = v => (v !== '' && !isNaN(Number(v))) ? Number(v) : null;
  rows.sort((a, b) => {
    const x = sortCellValue(a.children[st.i]), y = sortCellValue(b.children[st.i]);
    if (x === '' && y !== '') return 1;            // 空白永遠排最後
    if (y === '' && x !== '') return -1;
    const nx = num(x), ny = num(y);
    const r = (nx != null && ny != null) ? nx - ny : String(x).localeCompare(String(y), 'zh-Hant-TW', { numeric: true });
    return r * st.dir;
  });
  rows.forEach(tr => tb.appendChild(tr));
}
function makeSortable(table, key, skipCols) {
  if (!table) return;
  const skip = new Set(skipCols || []);
  table.querySelectorAll('thead th').forEach((th, i) => {
    if (skip.has(i) || !th.textContent.trim()) return;
    th.classList.add('sortable');
    if (!th.querySelector('.sort-icon')) th.insertAdjacentHTML('beforeend', ' <span class="sort-icon">⇅</span>');
    th.addEventListener('click', () => {
      const st = SORT_STATE[key];
      SORT_STATE[key] = (st && st.i === i) ? { i, dir: -st.dir } : { i, dir: 1 };
      applySort(table, key);
    });
  });
  applySort(table, key);
}

/* ── 可拖拉欄寬（通用）：拖表頭右邊緣調整，雙擊恢復預設；寬度記在這台電腦的瀏覽器 ── */
function makeResizable(table, key) {
  if (!table) return;
  let saved = {};
  try { saved = JSON.parse(lsGet('adm-colw-' + key) || '{}') || {}; } catch (_) {}
  const ths = [...table.querySelectorAll('thead th')];
  const setW = (th, w) => { th.style.width = w + 'px'; th.style.minWidth = w + 'px'; };
  ths.forEach((th, i) => {
    th.classList.add('adm-rs');
    if (saved[i]) setW(th, saved[i]);
    const h = document.createElement('div');
    h.className = 'adm-rs-h'; h.title = '拖拉調整欄寬，雙擊恢復';
    h.addEventListener('click', e => e.stopPropagation());
    h.addEventListener('dblclick', e => {
      e.stopPropagation(); th.style.width = ''; th.style.minWidth = '';
      delete saved[i]; lsSet('adm-colw-' + key, JSON.stringify(saved));
    });
    h.addEventListener('mousedown', e => {
      e.preventDefault(); e.stopPropagation();
      const x0 = e.clientX, w0 = th.getBoundingClientRect().width;
      h.classList.add('on');
      const move = ev => setW(th, Math.max(40, Math.round(w0 + ev.clientX - x0)));
      const up = () => {
        document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up);
        h.classList.remove('on');
        saved[i] = Math.round(th.getBoundingClientRect().width);
        lsSet('adm-colw-' + key, JSON.stringify(saved));
      };
      document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
    });
    th.appendChild(h);
  });
}

function findHeaderRow(rows) {
  for (let i = 0; i < Math.min(rows.length, 15); i++) {
    if ((rows[i] || []).some(h => normHdr(h) === '考生編號')) return i;
  }
  return -1;
}

// 把工作表的列轉成考生資料，並分類（純函式，方便測試）
function classifyImportRows(rows) {
  const hi = findHeaderRow(rows);
  if (hi < 0) return { fatal: '找不到「考生編號」欄位，請確認是報名系統匯出的檔案。' };
  const hdr = rows[hi].map(normHdr);
  const col = {}, meta = {}, unknown = [];
  hdr.forEach((h, i) => {
    if (!h) return;
    if (APP_FIELD_MAP[h] && col[APP_FIELD_MAP[h]] == null) col[APP_FIELD_MAP[h]] = i;
    else if (APP_META_MAP[h] && meta[APP_META_MAP[h]] == null) meta[APP_META_MAP[h]] = i;
    else unknown.push(h);
  });
  if (meta._last == null && meta._first == null && meta._full == null) return { fatal: '找不到「姓」「名」或「姓名」欄位。' };
  const out = { ok: [], pending: [], take_no: [], draft: [], error: [], unknown, headerRow: hi + 1 };
  const seen = {};
  for (let r = hi + 1; r < rows.length; r++) {
    const row = rows[r] || [];
    if (!row.some(v => cellStr(v) !== '')) continue;
    const get = k => (col[k] == null ? '' : row[col[k]]);
    const name = meta._full != null ? cellStr(row[meta._full])
      : (cellStr(meta._last != null ? row[meta._last] : '') + cellStr(meta._first != null ? row[meta._first] : ''));
    const rec = {
      reg_no: cellStr(get('reg_no')) || null,
      exam_no: cellStr(get('exam_no')).toUpperCase() || null,
      name,
      gender: normGender(cellStr(get('gender'))) || null,
      birth_date: parseDateCell(get('birth_date')),
      email: cellStr(get('email')) || null,
      phone: phoneStr(get('phone'), false) || null,
      mobile: phoneStr(get('mobile'), true) || null,
      mail_zip: cellStr(get('mail_zip')) || null,
      mail_address: cellStr(get('mail_address')) || null,
      emergency_name: cellStr(get('emergency_name')) || null,
      emergency_relation: cellStr(get('emergency_relation')) || null,
      emergency_phone: phoneStr(get('emergency_phone'), true) || null,
      applicant_identity: cellStr(get('applicant_identity')) || null,
      edu_qualification: cellStr(get('edu_qualification')) || null,
      edu_level: cellStr(get('edu_level')) || null,
      grad_year: intOrNull(get('grad_year')),
      grad_month: intOrNull(get('grad_month')),
      school_name: cellStr(get('school_name')) || null,
      dept_name: cellStr(get('dept_name')) || null,
      equivalent_note: cellStr(get('equivalent_note')) || null,
    };
    const exam = meta._exam_status != null ? cellStr(row[meta._exam_status]) : '';
    const pay = meta._pay_status != null ? cellStr(row[meta._pay_status]) : '';
    const item = { row: r + 1, rec, exam, pay, problems: [] };
    if (!rec.reg_no && !rec.exam_no) { out.take_no.push(item); continue; }
    if (exam === '暫存報名表' && !pay) { out.draft.push(item); continue; }
    if (!rec.exam_no) { item.problems.push('沒有考生編號'); out.error.push(item); continue; }
    if (!rec.name) { item.problems.push('沒有姓名'); out.error.push(item); continue; }
    if (seen[rec.exam_no]) { item.problems.push(`考生編號與第 ${seen[rec.exam_no]} 列重複`); out.error.push(item); continue; }
    seen[rec.exam_no] = r + 1;
    if (get('birth_date') !== '' && !rec.birth_date) item.problems.push('出生年月日無法辨識');
    if (exam === '提交報名表' && pay === '已繳書審費') out.ok.push(item);
    else out.pending.push(item);
  }
  return out;
}

async function parseImportFile(file) {
  const box = document.getElementById('imp-preview');
  box.innerHTML = '<div class="adm-hint" style="margin-top:12px">讀取中…</div>';
  try {
    await ensureXLSX();
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
    let res = null, sheetName = '';
    for (const sn of wb.SheetNames) {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: '' });
      if (findHeaderRow(rows) >= 0) { res = classifyImportRows(rows); sheetName = sn; break; }
    }
    if (!res) res = { fatal: '檔案裡找不到「考生編號」欄位，請確認是報名系統匯出的檔案。' };
    if (res.fatal) { box.innerHTML = `<div class="adm-warn" style="margin-top:12px">${esc(res.fatal)}</div>`; return; }

    await loadApplicants();
    const byNo = Object.fromEntries(APPS.map(a => [a.exam_no, a]));
    [...res.ok, ...res.pending].forEach(it => {
      const old = byNo[it.rec.exam_no];
      if (!old) { it.action = 'new'; return; }
      it.changed = APP_IMPORT_COLS.filter(k => String(old[k] ?? '') !== String(it.rec[k] ?? ''));
      it.diff = it.changed.map(k => ({ k, from: old[k] ?? '', to: it.rec[k] ?? '' }));
      it.pick = Object.fromEntries(it.changed.map(k => [k, true]));   // 每欄預設用新值
      it.action = it.changed.length ? 'update' : 'same';
    });
    const cand = [...res.ok, ...res.pending];
    const inFile = new Set(cand.map(it => it.rec.exam_no));
    res.missing = APPS.filter(a => !inFile.has(a.exam_no));
    res.file = file.name; res.sheet = sheetName;
    // 可能是同一人：姓名＋出生年月日相同、考生編號不同（檔案內或系統內）。同年同日生也有可能，只提醒不阻擋
    const keyOf = (name, birth) => (name && birth) ? String(name).replace(/\s+/g, '') + '|' + birth : null;
    const pool = {};
    APPS.forEach(a => { const k = keyOf(a.name, a.birth_date); if (k) (pool[k] = pool[k] || []).push({ exam_no: a.exam_no, where: '系統內' }); });
    cand.forEach(it => { const k = keyOf(it.rec.name, it.rec.birth_date); if (k) (pool[k] = pool[k] || []).push({ exam_no: it.rec.exam_no, where: '檔案內' }); });
    cand.forEach(it => {
      const k = keyOf(it.rec.name, it.rec.birth_date);
      const others = k ? pool[k].filter(o => o.exam_no !== it.rec.exam_no) : [];
      it.dupWith = [...new Map(others.map(o => [o.exam_no, o])).values()];
    });
    // 預設勾選：新增且沒有重複疑慮 → 勾；更新 → 由承辦人看過差異再勾；狀態待確認 → 不勾
    res.ok.forEach(it => { it.checked = it.action === 'new' && !it.dupWith.length; });
    res.pending.forEach(it => { it.checked = false; });
    IMP = res;
    drawImportPreview();
  } catch (e) {
    console.error(e);
    box.innerHTML = `<div class="adm-warn" style="margin-top:12px">讀取失敗：${esc(e.message || e)}</div>`;
  }
}

    </tr>`;
  const skipList = (arr, title) => arr.length ? `<details class="adm-skip"><summary>${title}（${arr.length} 列）</summary>
      <div class="adm-hint">${arr.map(it => `第 ${it.row} 列 ${esc(it.rec.exam_no || it.rec.reg_no || '')} ${esc(it.rec.name || '')}${it.problems.length ? '：' + esc(it.problems.join('；')) : ''}`).join('<br>')}</div></details>` : '';
  box.innerHTML = `
    <div class="adm-hint" style="margin-top:10px">檔案：${esc(r.file)} 工作表：${esc(r.sheet)} 標題在第 ${r.headerRow} 列</div>
    <div class="adm-imp-sum">
      <span>可匯入 <b>${r.ok.length}</b></span>
      <span>新增 <b>${cand.filter(i => i.action === 'new').length}</b></span>
      <span>更新 <b>${cand.filter(i => i.action === 'update').length}</b></span>
      <span>無變更 <b>${cand.filter(i => i.action === 'same').length}</b></span>
      <span>狀態待確認 <b>${r.pending.length}</b></span>
      ${cand.some(i => i.dupWith.length) ? `<span style="background:#FEE;border-color:#FCC">可能重複 <b style="color:var(--red)">${cand.filter(i => i.dupWith.length).length}</b></span>` : ''}
      <span>略過：只取號 <b>${r.take_no.length}</b>、暫存報名表 <b>${r.draft.length}</b></span>
      ${r.error.length ? `<span style="background:#FEE;border-color:#FCC">有問題 <b style="color:var(--red)">${r.error.length}</b></span>` : ''}
    </div>
    ${cand.some(i => i.action === 'update') ? `<div class="adm-warn">有 ${cand.filter(i => i.action === 'update').length} 位已匯入的考生資料不同，預設不更新。勾選考生後，可再逐欄決定「用新值」或「保留舊值」（預設用新值）。
      <button class="btn btn-sm btn-sec" style="margin-left:8px" onclick="checkAllUpdates(true)">勾選全部更新</button>

    ${cand.some(i => i.dupWith.length) ? '<div class="adm-warn">標示「可能重複」的考生，姓名與出生年月日和另一個考生編號相同，可能是同一人重複報名，也可能只是同名同生日。預設不勾選，請確認後再決定。</div>' : ''}
    ${r.pending.length ? '<div class="adm-warn">「狀態待確認」的考生不是「提交報名表＋已繳書審費」，預設不匯入；確認可以匯入的請自行勾選。</div>' : ''}

      <thead><tr><th style="width:36px"></th><th>考生編號</th><th>姓名</th><th>考試狀態</th><th>繳費狀態</th><th>動作</th><th>提醒</th></tr></thead>
      <tbody>
        ${r.ok.map((it, i) => row(it, i, false)).join('')}
        ${r.pending.length ? `<tr><td colspan="7" style="background:var(--cr3);font-weight:500">狀態待確認</td></tr>` + r.pending.map((it, i) => row(it, i, true)).join('') : ''}
      </tbody>
    </table></div>
    ${skipList(r.error, '有問題、不會匯入')}
    ${skipList(r.take_no, '只取號，略過')}
    ${skipList(r.draft, '暫存報名表，略過')}
    ${r.missing.length ? `<details class="adm-skip"><summary>系統裡有、但這次檔案沒有的考生（${r.missing.length} 位，不會刪除）</summary>
      <div class="adm-hint">${r.missing.map(a => esc(a.exam_no + ' ' + a.name)).join('、')}</div></details>` : ''}
    ${r.unknown.length ? `<details class="adm-skip"><summary>不讀取的欄位（${r.unknown.length} 個）</summary><div class="adm-hint">${r.unknown.map(esc).join('、')}</div></details>` : ''}`;
  makeSortable(box.querySelector('.tbl-wrap table'), 'import', [0]);

}
function checkAllUpdates(on) {
  [...IMP.ok, ...IMP.pending].forEach(it => { if (it.action === 'update') it.checked = on; });
  drawImportPreview();
}
function importSelection() {
  return IMP ? [...IMP.ok, ...IMP.pending].filter(it => it.checked && it.action !== 'same'
    && (it.action !== 'update' || Object.values(it.pick).some(Boolean))) : [];
}
function updateImportFoot() {
  const sel = importSelection();
  document.getElementById('imp-btn').disabled = !sel.length;
  document.getElementById('imp-foot-msg').textContent = sel.length ? `將寫入 ${sel.length} 位考生（新增 ${sel.filter(i => i.action === 'new').length}、更新 ${sel.filter(i => i.action === 'update').length}）` : '沒有需要寫入的資料';
}

async function confirmImport() {
  const sel = importSelection();
  if (!sel.length || !canWrite()) return;
  const btn = document.getElementById('imp-btn');
  btn.disabled = true; btn.textContent = '匯入中…';
  try {
    const byNo = Object.fromEntries(APPS.map(a => [a.exam_no, a]));
    const now = new Date().toISOString();
    const payload = sel.map(it => {
      const old = byNo[it.rec.exam_no] || {};
      const addr = splitAddress(it.rec.mail_address, it.rec.mail_zip);
      const rec = { ...it.rec };
      if (it.action === 'update') it.changed.forEach(k => { if (!it.pick[k]) rec[k] = old[k] ?? null; });   // 逐欄保留舊值
      return {
        round_id: CUR.id, ...rec,
        // 縣市、鄉鎮：已有值（可能手動改過）就保留，沒有才用地址判斷
        county: old.county || addr.county, township: old.township || addr.township,
        imported_at: now,
      };
    });
    for (let i = 0; i < payload.length; i += 200) {
      const chunk = payload.slice(i, i + 200);
      assertRows(await sb.from('adm_applicants').upsert(chunk, { onConflict: 'round_id,exam_no' }).select('id'), chunk.length, '寫入考生資料');
    }
    const nNew = sel.filter(i => i.action === 'new').length, nUpd = sel.length - nNew;
    const updDetail = sel.filter(i => i.action === 'update').map(i => `${i.rec.exam_no}（${i.changed.filter(k => i.pick[k]).map(k => APP_COL_ZH[k]).join('、')}）`).join('；');
    await writeAuditLog('招生', '匯入考生資料', 'adm_applicants', CUR.id, CUR.code,
      `檔案 ${IMP.file}：新增 ${nNew}、更新 ${nUpd}${updDetail ? '（' + updDetail + '）' : ''}；略過 只取號 ${IMP.take_no.length}、暫存 ${IMP.draft.length}、有問題 ${IMP.error.length}`);
    closeModal('imp-modal');
    showToast(`✅ 已匯入：新增 ${nNew}、更新 ${nUpd}`);
    await loadRound(CUR.id);
    await renderApplicantsPage();
  } catch (e) {
    console.error(e);
    showToast('匯入失敗：' + (e.message || e), 'error');
  } finally {
    btn.disabled = false; btn.textContent = '確認匯入';
  }
}

async function saveApplicant() {
  if (!APP_EDIT || !canWrite()) return;
  const old = APPS.find(a => a.id === APP_EDIT.id);
  const keys = ['name','gender','birth_date','edu_level','school_name','school_short','dept_name','county','township','research_tag',
                'mobile','phone','email','mail_address','emergency_name','emergency_relation','emergency_phone','review_note','background_override'];
  const patch = {}, changed = [];
  keys.forEach(k => {
    let v = APP_EDIT[k]; if (typeof v === 'string') v = v.trim(); if (v === '') v = null;
    if ((old[k] ?? null) !== v) { patch[k] = v; changed.push(APP_COL_ZH[k] || k); }
  });
  if (!changed.length) { closeModal('app-modal'); return; }
  if (!patch.name && 'name' in patch) { alert('姓名不可空白'); return; }
  try { assertRows(await sb.from('adm_applicants').update(patch).eq('id', old.id).select('id'), 1, '儲存考生資料'); }
  catch (e) { showToast('儲存失敗：' + (e.message || e), 'error'); return; }
  Object.assign(old, patch);   // 同步快取
  await writeAuditLog('招生', '修改考生資料', 'adm_applicants', old.id, `${old.exam_no} ${old.name}`, '修改：' + changed.join('、'));
  showToast('✅ 已儲存');
  closeModal('app-modal');
  await loadApplicants(); drawApplicants();
}
async function deleteApplicant() {
  const a = APPS.find(x => x.id === APP_EDIT?.id); if (!a || !canWrite()) return;
  if (CUR.scoresByApplicant[a.id]) { alert('這位考生已有分數，不能刪除。'); return; }
  if (!confirm(`確定刪除考生 ${a.exam_no} ${a.name}？`)) return;
  try { assertRows(await sb.from('adm_applicants').delete().eq('id', a.id).select('id'), 1, '刪除考生'); }
  catch (e) { showToast('刪除失敗：' + (e.message || e), 'error'); return; }
  APPS = APPS.filter(x => x.id !== a.id);   // 同步快取
  await writeAuditLog('招生', '刪除考生', 'adm_applicants', a.id, `${a.exam_no} ${a.name}`, '');
  showToast('已刪除');
  closeModal('app-modal');
  await loadRound(CUR.id); await renderApplicantsPage();
}

/* ── 委員 Excel 範本（ExcelJS：可寫格線、字型、列高；版面依承辦人調整的 tpl_all_R2.xlsx） ── */
async function ensureExcelJS() {
  if (window.ExcelJS) return;
  await new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
    s.onload = res; s.onerror = () => rej(new Error('Excel 元件載入失敗，請確認網路'));
    document.head.appendChild(s);
  });
}
function saveBlob(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function safeSheetName(name, used) {
  let n = String(name || '委員').replace(/[\[\]\*\?\/\\:]/g, '').slice(0, 31) || '委員';
  let k = n, i = 2;
  while (used.has(k)) { k = (n.slice(0, 28) + '_' + i++); }
  used.add(k); return k;
}
const TPL_FONT = { name: '新細明體', size: 12 };
const TPL_THIN = { style: 'thin' };
const TPL_BORDER = { top: TPL_THIN, left: TPL_THIN, bottom: TPL_THIN, right: TPL_THIN };
function colLetter(i) { let s = '', n = i + 1; while (n) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }

// 估算文字在 Excel 欄寬內要幾行：中日韓全形字算 2、半形算 1（新細明體 12 號）
function wrapLines(text, colWidth, cap) {
  let w = 0;
  for (const ch of String(text || '')) w += /[\u2E80-\uFFEF]/.test(ch) ? 2 : 1;
  return Math.max(1, Math.ceil(w / (cap || Math.floor(colWidth * 0.865))));   // 實測：欄寬 42.8 一行約容納 37 單位（R2 範本比對）
}

/* ── 書審評分用表（空白）Excel 版：版面同列印版，給委員手寫或自行調整後列印 ── */
async function downloadReviewFormsExcel(onlyId) {
  try {
    await ensureExcelJS();
    const crit = stageCriteria('review');
    const revs = stageReviewers('review').filter(v => !onlyId || v.id === onlyId);
    const apps = [...APPS].sort((a, b) => String(a.exam_no).localeCompare(String(b.exam_no)));
    const formula = crit.map(x => `${x.name}×${wPct(x.weight)}%`).join('＋');
    // 版面依承辦人修訂的 116-1 書審評分表：說明在表頭上方、書審備註在最後一欄
    const head = ['考生編號', '姓名', ...crit.map(x => `${wPct(x.weight)}%${x.name}`), '加權\n總分', '研究類型', '評語', '書審備註（基本背景）'];
    const bgCol = head.length;
    const nCol = head.length;
    const wb = new ExcelJS.Workbook(), used = new Set();
    revs.forEach(v => {
      const ws = wb.addWorksheet(safeSheetName(reviewerName(v), used), {
        pageSetup: { paperSize: 9, orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: apps.length <= 25 ? 1 : 0,
                     horizontalCentered: true, margins: { left: 0.4, right: 0.4, top: 0.4, bottom: 0.4, header: 0.2, footer: 0.2 } },
      });
      ws.pageSetup.printTitlesRow = '4:4';
      ws.columns = [12, 10, ...crit.map(() => 14), 9, 8, 14, 60.4].map(w => ({ width: w }));
      // 標題、委員
      ws.mergeCells(1, 1, 1, nCol);
      const t = ws.getCell(1, 1);
      t.value = `${formTitle()}評分表`; t.font = { ...TPL_FONT, size: 15, bold: true }; t.alignment = { horizontal: 'center', vertical: 'middle' };
      ws.mergeCells(2, 1, 2, 3);
      const m = ws.getCell(2, 1); m.value = `書審委員：${reviewerName(v)}`; m.font = { ...TPL_FONT, size: 13, bold: true };
      ws.mergeCells(2, nCol - 1, 2, nCol);
      const n = ws.getCell(2, nCol - 1); n.value = `考生共 ${apps.length} 位`; n.font = TPL_FONT; n.alignment = { horizontal: 'right' };
      // 說明（表頭上方）
      ws.mergeCells(3, 1, 3, nCol);
      ws.getCell(3, 1).value = `※ 各項滿分為 100 分。加權總分＝${formula}。`; ws.getCell(3, 1).font = { ...TPL_FONT, size: 13 };
      // 表頭
      const hr = ws.getRow(4);   // 列高不設定，交給 Excel 自動調整
      head.forEach((h, i) => {
        const c = hr.getCell(i + 1);
        c.value = h; c.font = { ...TPL_FONT, bold: true }; c.border = TPL_BORDER;
        c.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
        c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEEEEEE' } };
      });
      // 考生列（評分欄空白）
      apps.forEach((a, k) => {
        const r = 5 + k, row = ws.getRow(r);
        const c1 = colLetter(2), cN = colLetter(1 + crit.length);   // colLetter 從 0 起算：2＝C
        const terms = crit.map((x, i) => `${colLetter(2 + i)}${r}*${Number(x.weight) / 100}`).join('+');
        const wsum = { formula: `IF(COUNT(${c1}${r}:${cN}${r})<${crit.length},"",ROUND(${terms},2))` };   // 各項都有分數才算
        const vals = [a.exam_no, a.name, ...crit.map(() => null), wsum, null, null, backgroundOf(a)];
        vals.forEach((val, i) => {
          const c = row.getCell(i + 1), isBg = i + 1 === bgCol;
          c.value = val; c.font = isBg ? { ...TPL_FONT, size: 11 } : TPL_FONT; c.border = TPL_BORDER;
          c.alignment = { vertical: 'middle', wrapText: isBg, horizontal: i >= 2 && i <= 2 + crit.length ? 'center' : undefined };
          if (i === 2 + crit.length) c.numFmt = '0.00';
        });
      });
      // 簽名
      const r2 = 5 + apps.length + 3;
      ws.mergeCells(r2, 1, r2, nCol);
      const sg = ws.getCell(r2, 1);
      sg.value = '委員簽名：＿＿＿＿＿＿＿＿＿＿' + ' '.repeat(8) + '日期：＿＿＿＿年＿＿月＿＿日';
      sg.font = { ...TPL_FONT, size: 13 }; sg.alignment = { horizontal: 'right' };

    const buf = await wb.xlsx.writeBuffer();
    saveBlob(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), fn);
    writeAuditLog('招生', '下載書審評分用表 Excel', 'adm_reviewers', CUR.id, CUR.code, revs.map(reviewerName).join('、'));
  } catch (e) { console.error(e); showToast('產生評分用表失敗：' + (e.message || e), 'error'); }
}

/* ════════════════════════════════════════════════════════════════
   成績表格（第 5 批）：書審／面試共用；依委員或依考生；逐格自動儲存；可從 Excel 貼上
   ════════════════════════════════════════════════════════════════ */
const GS = { stage: 'review', view: 'reviewer', revId: null, appId: null };   // 畫面狀態
let SC = {};      // 分數：`${appId}|${revId}|${critId}` → { id, score }
let CM = {};      // 評語與研究類型：`${appId}|${revId}` → { id, comment, research_tag }
const skey = (a, r, c) => `${a}|${r}|${c}`;
const ckey = (a, r) => `${a}|${r}`;
function stageLocked(st) { return st === 'review' ? !!CUR.review_locked_at : !!CUR.admission_locked_at; }
function gridEditable(st) { return canWrite() && !stageLocked(st); }
function fmtN(v) { return v == null || v === '' ? '' : Number(v).toFixed(CUR.decimals ?? 2); }
function round2(x, d) { const p = Math.pow(10, d == null ? (CUR.decimals ?? 2) : d); return Math.round((x + Number.EPSILON) * p) / p; }

async function loadStageData(st) {
  await loadApplicants();
  const crit = stageCriteria(st), revs = stageReviewers(st);
  SC = {}; CM = {};
  if (crit.length) {
    const { data, error } = await sb.from('adm_scores').select('id,applicant_id,reviewer_id,criterion_id,score')
      .eq('round_id', CUR.id).in('criterion_id', crit.map(c => c.id)).limit(20000);
    if (error) { showToast('讀取分數失敗：' + error.message, 'error'); return false; }
    (data || []).forEach(x => { SC[skey(x.applicant_id, x.reviewer_id, x.criterion_id)] = { id: x.id, score: x.score == null ? null : Number(x.score) }; });
  }
  if (revs.length) {
    const { data, error } = await sb.from('adm_comments').select('id,applicant_id,reviewer_id,comment,research_tag')
      .eq('round_id', CUR.id).in('reviewer_id', revs.map(v => v.id)).limit(20000);
    if (error) { showToast('讀取評語失敗：' + error.message, 'error'); return false; }
    (data || []).forEach(x => { CM[ckey(x.applicant_id, x.reviewer_id)] = { id: x.id, comment: x.comment || '', research_tag: x.research_tag || '' }; });
  }
  return true;
}

/* ── 計算 ── */
// 單一委員對單一考生的加權分：所有項目都有分數才算
function reviewerWeighted(st, appId, revId) {
  const crit = stageCriteria(st); let sum = 0;
  for (const c of crit) { const v = SC[skey(appId, revId, c.id)]; if (!v || v.score == null) return null; sum += v.score * Number(c.weight) / 100; }
  return crit.length ? round2(sum) : null;
}
// 考生在某階段的成績：各項目先平均（只平均有給分的委員）再加權；任一項目沒有人給分 → null
function applicantStageScore(st, appId) {
  const crit = stageCriteria(st), revs = stageReviewers(st); let sum = 0;
  const avgs = {};
  for (const c of crit) {
    const vals = revs.map(r => SC[skey(appId, r.id, c.id)]).filter(v => v && v.score != null).map(v => v.score);
    if (!vals.length) return { total: null, avgs };
    avgs[c.id] = vals.reduce((a, b) => a + b, 0) / vals.length;
    sum += avgs[c.id] * Number(c.weight) / 100;
  }
  return { total: crit.length ? round2(sum) : null, avgs };
}
function reviewerSpread(st, appId) {
  const ws = stageReviewers(st).map(r => reviewerWeighted(st, appId, r.id)).filter(x => x != null);
  return ws.length >= 2 ? round2(Math.max(...ws) - Math.min(...ws)) : null;
}
function reviewerProgress(st, revId) {
  const crit = stageCriteria(st); const need = APPS.length * crit.length;
  let got = 0; APPS.forEach(a => crit.forEach(c => { const v = SC[skey(a.id, revId, c.id)]; if (v && v.score != null) got++; }));
  return { got, need };
}

/* ── 頁面 ── */
async function renderScoresPage(st) {
  GS.stage = st;
  const c = document.getElementById('content');
  if (!CUR) { c.innerHTML = '<div class="adm-placeholder">請先在「梯次設定」建立梯次。</div>'; return; }
  c.innerHTML = '<div class="adm-placeholder">讀取中…</div>';
  if (!(await loadStageData(st))) return;
  const revs = stageReviewers(st);
  if (!GS.revId || !revs.some(r => r.id === GS.revId)) GS.revId = revs[0]?.id || null;
  if (!GS.appId || !APPS.some(a => a.id === GS.appId)) GS.appId = APPS[0]?.id || null;
  drawScoresPage();
}

function drawScoresPage() {
  const st = GS.stage, c = document.getElementById('content');
  const crit = stageCriteria(st), revs = stageReviewers(st);
  const problems = [];
  if (!APPS.length) problems.push('尚未匯入考生資料');
  if (!crit.length) problems.push(`尚未設定${STAGE_ZH[st]}評分項目`);
  if (!revs.length) problems.push(`尚未設定${STAGE_ZH[st]}委員`);
  const locked = stageLocked(st), editable = gridEditable(st);
  // 彙總
  const done = revs.filter(r => { const p = reviewerProgress(st, r.id); return p.need && p.got === p.need; }).length;
  const missing = APPS.filter(a => applicantStageScore(st, a.id).total == null).length;
  const spreadN = APPS.filter(a => { const s = reviewerSpread(st, a.id); return s != null && s > Number(CUR.spread_alert || 15); }).length;
  const passN = st === 'review' && CUR.pass_threshold != null
    ? APPS.filter(a => { const t = applicantStageScore(st, a.id).total; return t != null && t >= Number(CUR.pass_threshold); }).length : null;
  c.innerHTML = `
  <div class="page-hdr">

  </div>
  ${problems.length ? `<div class="adm-warn">無法評分：${problems.map(esc).join('、')}。</div>` : `
  <div class="adm-stats">
    <div class="adm-stat"><b>${done}</b>/ ${revs.length} 位委員已完成</div>
    <div class="adm-stat"><b>${missing}</b>位考生分數未齊</div>
    <div class="adm-stat"><b style="color:${spreadN ? 'var(--red)' : 'var(--navy)'}">${spreadN}</b>位考生的委員給分差距 > ${esc(CUR.spread_alert ?? 15)} 分</div>
    ${passN != null ? `<div class="adm-stat"><b>${passN}</b>位目前達門檻（≥ ${esc(CUR.pass_threshold)}，分數未齊者不計）</div>` : ''}
  </div>
  <div class="toolbar">

    ${GS.view === 'reviewer'
      ? `<select class="fselect" style="width:auto" onchange="GS.revId=this.value;drawScoresPage()">${revs.map(r => {
          const p = reviewerProgress(st, r.id);
          return `<option value="${r.id}" ${r.id === GS.revId ? 'selected' : ''}>${esc((r.code ? r.code + ' ' : '') + reviewerName(r))}（${p.got}/${p.need}）</option>`; }).join('')}</select>`
      : `<button class="btn btn-sm btn-sec" onclick="stepApplicant(-1)">◀</button>
         <select class="fselect" style="width:auto" onchange="GS.appId=this.value;drawScoresPage()">${APPS.map(a => `<option value="${a.id}" ${a.id === GS.appId ? 'selected' : ''}>${esc(a.exam_no + ' ' + a.name)}</option>`).join('')}</select>
         <button class="btn btn-sm btn-sec" onclick="stepApplicant(1)">▶</button>`}
    <span class="adm-hint">${editable ? '輸入後自動儲存；Enter 往下、Tab 往右；可從 Excel 選取一塊直接貼上。' : '唯讀'}</span>
  </div>
  <div id="grid-box"></div>`}`;
  if (!problems.length) (GS.view === 'reviewer' ? drawReviewerGrid : drawApplicantGrid)();

function stepApplicant(d) {
  const i = APPS.findIndex(a => a.id === GS.appId); const j = Math.min(APPS.length - 1, Math.max(0, i + d));
  GS.appId = APPS[j]?.id; drawScoresPage();
}

// 一個輸入格：data-a 考生、data-r 委員、data-k 欄位（crit:<id>｜tag｜comment）
function cellHtml(appId, revId, k, val, isText) {
  const dis = gridEditable(GS.stage) ? '' : 'disabled';
  if (k === 'comment') return `<textarea class="adm-cell txt" rows="1" ${dis} data-a="${appId}" data-r="${revId}" data-k="${k}" data-old="${esc(val ?? '')}"
    oninput="autoGrow(this)" onkeydown="cellKey(event)" onchange="saveCell(this)" onpaste="pasteCells(event)">${esc(val ?? '')}</textarea>`;
  return `<input class="adm-cell ${isText ? 'txt' : ''}" ${dis} data-a="${appId}" data-r="${revId}" data-k="${k}" value="${esc(val ?? '')}" data-old="${esc(val ?? '')}"
    ${isText ? '' : 'inputmode="decimal"'} onkeydown="cellKey(event)" onchange="saveCell(this)" onpaste="pasteCells(event)">`;
}
function cellVal(appId, revId, k) {
  if (k.startsWith('crit:')) { const v = SC[skey(appId, revId, k.slice(5))]; return v && v.score != null ? v.score : ''; }
  const m = CM[ckey(appId, revId)] || {};
  return k === 'tag' ? (m.research_tag || '') : (m.comment || '');
}
function gridKeys(st) { return [...stageCriteria(st).map(c => 'crit:' + c.id), 'tag', 'comment']; }

function refreshReviewerCalc() {
  const st = GS.stage, revId = GS.revId;
  const ws = APPS.map(a => ({ id: a.id, w: reviewerWeighted(st, a.id, revId) }));
  const sorted = ws.filter(x => x.w != null).map(x => x.w).sort((a, b) => b - a);
  ws.forEach(x => {
    const tw = document.querySelector(`td[data-w="${x.id}"]`), tr = document.querySelector(`td[data-rank="${x.id}"]`);
    if (tw) { tw.textContent = fmtN(x.w); tw.dataset.sort = x.w ?? ''; }
    if (tr) { const rk = x.w == null ? '' : sorted.indexOf(x.w) + 1; tr.textContent = rk; tr.dataset.sort = rk; }
  });
}
