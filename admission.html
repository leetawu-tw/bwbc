function refreshApplicantCalc() {
  const st = GS.stage, a = GS.appId;
  stageReviewers(st).forEach(r => { const td = document.querySelector(`td[data-rw="${r.id}"]`); if (td) td.textContent = fmtN(reviewerWeighted(st, a, r.id)); });
  const res = applicantStageScore(st, a);
  stageCriteria(st).forEach(c => { const td = document.querySelector(`td[data-avg="${c.id}"]`); if (td) td.textContent = res.avgs[c.id] != null ? fmtN(round2(res.avgs[c.id])) : ''; });
  const t = document.getElementById('app-total'); if (t) t.textContent = res.total == null ? '（分數未齊）' : fmtN(res.total);
  const sp = reviewerSpread(st, a), el = document.getElementById('app-spread');
  if (el) {
    const over = sp != null && sp > Number(CUR.spread_alert || 15);
    el.className = over ? 'adm-spread' : '';
    el.textContent = sp == null ? '' : `委員加權分最高與最低差 ${fmtN(sp)} 分${over ? '，超過提示門檻' : ''}`;
    if (st === 'review' && res.total != null && CUR.pass_threshold != null)
      el.textContent += ` ${res.total >= Number(CUR.pass_threshold) ? '✓ 達門檻' : '✗ 未達門檻'}`;
  }
}

// 評語依內容自動長高（像 Excel 自動列高）
function autoGrow(t) { t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; }
function growAll(root) { (root || document).querySelectorAll('textarea.adm-cell').forEach(autoGrow); }

/* ── 鍵盤 ── */
function cellKey(e) {
  if (e.key !== 'Enter') return;
  if (e.altKey && e.target.tagName === 'TEXTAREA') {   // Alt+Enter：評語內換行（同 Excel）
    e.preventDefault();
    const t = e.target, a = t.selectionStart, b = t.selectionEnd;
    t.value = t.value.slice(0, a) + '\n' + t.value.slice(b); t.selectionStart = t.selectionEnd = a + 1; autoGrow(t); return;
  }
  e.preventDefault();
  const inp = e.target, td = inp.closest('td'), tr = td.closest('tr');
  const col = [...tr.children].indexOf(td);
  let row = e.shiftKey ? tr.previousElementSibling : tr.nextElementSibling;
  while (row && !row.children[col]?.querySelector('.adm-cell')) row = e.shiftKey ? row.previousElementSibling : row.nextElementSibling;
  const nx = row?.children[col]?.querySelector('.adm-cell');
  inp.dispatchEvent(new Event('change'));
  if (nx) { nx.focus(); nx.select(); }
}

/* ── 儲存一格 ── */
const SAVE_Q = {};   // 同一格串行儲存，避免連續輸入時順序錯亂
function saveCell(inp) {
  const k = `${inp.dataset.a}|${inp.dataset.r}|${inp.dataset.k}`;
  SAVE_Q[k] = (SAVE_Q[k] || Promise.resolve()).then(() => doSaveCell(inp));
  return SAVE_Q[k];
}
async function doSaveCell(inp) {
  if (!gridEditable(GS.stage)) return;
  const appId = inp.dataset.a, revId = inp.dataset.r, k = inp.dataset.k;
  const raw = inp.value.trim(), old = inp.dataset.old;
  if (raw === old) return;
  inp.classList.remove('bad', 'saved'); inp.title = '';
  const app = APPS.find(x => x.id === appId), rev = (CUR.reviewers || []).find(x => x.id === revId);
  const who = `${app?.exam_no || ''} ${app?.name || ''}／${rev ? reviewerName(rev) : ''}`;
  try {
    if (k.startsWith('crit:')) {
      const critId = k.slice(5), crit = (CUR.criteria || []).find(c => c.id === critId);
      let val = null;
      if (raw !== '') {
        val = Number(raw);
        if (!Number.isFinite(val) || val < 0 || val > 100) { inp.classList.add('bad'); inp.title = '分數必須是 0～100'; return; }
      }
      inp.classList.add('saving');
      const key = skey(appId, revId, critId), cur = SC[key];
      if (val == null) {
        if (cur) { assertRows(await sb.from('adm_scores').delete().eq('id', cur.id).select('id'), 1, '清除分數'); delete SC[key]; }
      } else {
        const res = await sb.from('adm_scores').upsert({ round_id: CUR.id, applicant_id: appId, reviewer_id: revId, criterion_id: critId, score: val, source: 'manual' },
          { onConflict: 'applicant_id,reviewer_id,criterion_id' }).select('id,score');
        assertRows(res, 1, '儲存分數');
        SC[key] = { id: res.data[0].id, score: Number(res.data[0].score) };
      }
      writeAuditLog('招生', `修改${STAGE_ZH[GS.stage]}分數`, 'adm_scores', appId, who, `${crit?.name || ''}：${old || '（空白）'} → ${raw || '（空白）'}`);
    } else {
      inp.classList.add('saving');
      const key = ckey(appId, revId), cur = CM[key] || {};
      const row = { round_id: CUR.id, applicant_id: appId, reviewer_id: revId,
        comment: k === 'comment' ? (raw || null) : (cur.comment || null),
        research_tag: k === 'tag' ? (raw || null) : (cur.research_tag || null) };
      const res = await sb.from('adm_comments').upsert(row, { onConflict: 'applicant_id,reviewer_id' }).select('id,comment,research_tag');
      assertRows(res, 1, '儲存' + (k === 'tag' ? '研究類型' : '評語'));
      CM[key] = { id: res.data[0].id, comment: res.data[0].comment || '', research_tag: res.data[0].research_tag || '' };
      writeAuditLog('招生', `修改${STAGE_ZH[GS.stage]}${k === 'tag' ? '研究類型' : '評語'}`, 'adm_comments', appId, who, `${old || '（空白）'} → ${raw || '（空白）'}`);
    }
    inp.dataset.old = raw;
    const td = inp.closest('td'); if (td && td.dataset.sort != null) td.dataset.sort = raw;
    inp.classList.remove('saving'); inp.classList.add('saved');
    setTimeout(() => inp.classList.remove('saved'), 900);
    if (GS.view === 'reviewer') refreshReviewerCalc(); else refreshApplicantCalc();
  } catch (e) {
    console.error(e);
    inp.classList.remove('saving'); inp.classList.add('bad'); inp.title = '儲存失敗：' + (e.message || e);
    showToast('儲存失敗：' + (e.message || e), 'error');
  }
}

/* ── 從 Excel 貼上一整塊 ── */
function pasteCells(e) {
  const text = (e.clipboardData || window.clipboardData)?.getData('text') || '';
  if (!/[\t\n]/.test(text.replace(/\n$/, ''))) return;        // 單格照一般貼上
  e.preventDefault();
  if (!gridEditable(GS.stage)) return;
  const rows = text.replace(/\r/g, '').replace(/\n$/, '').split('\n').map(r => r.split('\t'));
  const start = e.target, td = start.closest('td'), tr = td.closest('tr');
  const tds = [...tr.children], col0 = tds.indexOf(td);
  let row = tr, n = 0;
  const jobs = [];
  rows.forEach(vals => {
    if (!row) return;
    let ci = col0;
    vals.forEach(v => {
      // 跳過計算欄（沒有輸入格的欄）
      while (row.children[ci] && !row.children[ci].querySelector('.adm-cell')) ci++;
      const inp = row.children[ci]?.querySelector('.adm-cell');
      if (inp && !inp.disabled) { inp.value = v.trim(); jobs.push(inp); n++; }
      ci++;
    });
    do { row = row.nextElementSibling; } while (row && !row.querySelector('.adm-cell'));
  });
  (async () => { for (const inp of jobs) await saveCell(inp); showToast(`已貼上 ${n} 格`); })();
}

/* ════════════════════════════════════════════════════════════════
   匯入委員 Excel（第 5 批）
   一個檔案多個工作表（工作表名稱＝委員姓名）或每位委員一個檔案都可以；
   欄位對應由系統猜、承辦人確認，確認後記在 adm_criteria.import_label；
   匯入前逐格比對新舊（規則 40），預設用新值、可逐格改成保留舊值。
   ════════════════════════════════════════════════════════════════ */
let SIMP = null;
const normTxt = t => normHdr(t).replace(/\(滿分為?100\)/g, '').replace(/[\d.]+%/g, '').replace(/[:：]/g, '');

function openScoreImport(st) {
  if (!gridEditable(st)) return;
  SIMP = { st, sheets: [], files: [] };
  document.getElementById('simp-title').textContent = `匯入委員 Excel（${STAGE_ZH[st]}）`;
  document.getElementById('simp-btn').disabled = true;
  document.getElementById('simp-foot').textContent = '';
  document.getElementById('simp-body').innerHTML = `
    <div class="adm-drop" id="simp-drop" onclick="document.getElementById('simp-file').click()">
      <div style="font-size:28px">📊</div>
      <div style="margin-top:6px">點這裡選擇檔案，或把委員交回的 Excel 拖進來（可一次多個檔案）</div>
      <div class="adm-hint">工作表名稱＝委員姓名時自動對應；需要有「考生編號」欄。空白格不會清掉系統裡已有的分數。</div>
    </div>
    <input type="file" id="simp-file" accept=".xlsx,.xls" multiple style="display:none" onchange="if(this.files.length)parseScoreFiles([...this.files])">
    <div id="simp-preview"></div>`;
  const drop = document.getElementById('simp-drop');
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files.length) parseScoreFiles([...e.dataTransfer.files]); });
  openModal('simp-modal');
}

function guessReviewer(st, sheetName, fileName, singleSheet) {
  const revs = stageReviewers(st), sn = normHdr(sheetName), fn = normHdr(fileName);
  return revs.find(r => normHdr(reviewerName(r)) === sn)
      || revs.find(r => sn.includes(normHdr(reviewerName(r))))
      || (singleSheet ? revs.find(r => fn.includes(normHdr(reviewerName(r)))) : null)
      || null;
}
// 欄位猜測：已記住的 import_label → 標題含項目名稱 → 「附表N」對第 N 個項目
function guessMapping(st, headers) {
  const crit = stageCriteria(st), map = {};
  const hs = headers.map((h, i) => ({ i, raw: h, n: normHdr(h), t: normTxt(h) })).filter(h => h.n);
  crit.forEach((c, idx) => {
    const lbl = c.import_label ? normHdr(c.import_label) : null;
    let hit = (lbl && hs.find(h => h.n === lbl)) || hs.find(h => h.t.includes(normTxt(c.name)));
    if (!hit) { const re = new RegExp('附表' + (idx + 1) + '(?!\\d)'); hit = hs.find(h => re.test(h.n)); }
    map['crit:' + c.id] = hit ? hit.raw : '';
  });
  map.tag = (hs.find(h => h.n.includes('研究類型')) || {}).raw || '';
  map.comment = (hs.find(h => h.n.includes('評語')) || {}).raw || '';
  return map;
}

async function parseScoreFiles(files) {
  const box = document.getElementById('simp-preview');
  box.innerHTML = '<div class="adm-hint" style="margin-top:12px">讀取中…</div>';
  try {
    await ensureXLSX();
    const st = SIMP.st, sheets = [];
    for (const f of files) {
      const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
      const usable = wb.SheetNames.map(sn => ({ sn, rows: XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: '' }) }))
        .filter(x => findHeaderRow(x.rows) >= 0);
      usable.forEach(x => {
        const hi = findHeaderRow(x.rows);
        const rev = guessReviewer(st, x.sn, f.name, usable.length === 1);
        sheets.push({ file: f.name, sheet: x.sn, rows: x.rows, hi, headers: x.rows[hi].map(h => String(h ?? '')), revId: rev?.id || '' });
      });
    }
    if (!sheets.length) { box.innerHTML = '<div class="adm-warn" style="margin-top:12px">檔案裡找不到含「考生編號」欄的工作表。</div>'; return; }
    // 欄位對應：以第一個工作表猜，其他工作表依「標題文字」套用
    const allHeaders = [...new Set(sheets.flatMap(x => x.headers.filter(h => normHdr(h))))];
    SIMP.sheets = sheets; SIMP.allHeaders = allHeaders; SIMP.map = guessMapping(st, sheets[0].headers);
    await loadStageData(st);
    buildScoreDiff();
    drawScoreImport();
  } catch (e) { console.error(e); box.innerHTML = `<div class="adm-warn" style="margin-top:12px">讀取失敗：${esc(e.message || e)}</div>`; }
}

function colIndex(headers, raw) { if (!raw) return -1; const n = normHdr(raw); return headers.findIndex(h => normHdr(h) === n); }

// 依目前的委員與欄位對應，算出每個工作表的變更
function buildScoreDiff() {
  const st = SIMP.st, crit = stageCriteria(st), byNo = Object.fromEntries(APPS.map(a => [a.exam_no, a]));
  const usedRev = {};
  SIMP.sheets.forEach(sh => {
    sh.items = []; sh.errors = []; sh.same = 0; sh.blank = 0;
    if (!sh.revId) return;
    usedRev[sh.revId] = (usedRev[sh.revId] || 0) + 1;
    const iNo = sh.headers.findIndex(h => normHdr(h) === '考生編號');
    const cols = gridKeys(st).map(k => ({ k, i: colIndex(sh.headers, SIMP.map[k]) }));
    const seen = {};
    for (let r = sh.hi + 1; r < sh.rows.length; r++) {
      const row = sh.rows[r] || [];
      const no = cellStr(row[iNo]).toUpperCase();
      if (!no) continue;
      const app = byNo[no];
      if (!app) {
        // 簽名列、說明列等沒有任何分數／評語的列直接略過，不列為問題
        if (cols.some(({ i }) => i >= 0 && cellStr(row[i]) !== '')) sh.errors.push(`第 ${r + 1} 列：考生編號 ${no} 不在本梯次考生名單`);
        continue;
      }
      if (seen[no]) { sh.errors.push(`第 ${r + 1} 列：考生編號 ${no} 與第 ${seen[no]} 列重複，略過`); continue; }
      seen[no] = r + 1;
      cols.forEach(({ k, i }) => {
        if (i < 0) return;
        const v = row[i];
        const txt = cellStr(v);
        if (txt === '') { sh.blank++; return; }                        // 空白不清除既有資料
        let nv = txt;
        if (k.startsWith('crit:')) {
          nv = typeof v === 'number' ? v : Number(txt);
          if (!Number.isFinite(nv) || nv < 0 || nv > 100) { sh.errors.push(`第 ${r + 1} 列 ${no}：「${txt}」不是 0～100 的分數`); return; }
          nv = round2(nv, 2);
        }
        const ov = cellVal(app.id, sh.revId, k);
        if (String(ov) === String(nv)) { sh.same++; return; }
        sh.items.push({ app, k, from: ov, to: nv, use: true });
      });
    }
  });
  SIMP.dupRev = Object.keys(usedRev).filter(id => usedRev[id] > 1);
}

function keyLabel(k) {
  if (k === 'tag') return '研究類型'; if (k === 'comment') return '評語';
  const c = (CUR.criteria || []).find(x => x.id === k.slice(5)); return c ? c.name : k;
}

function drawScoreImport() {
  const st = SIMP.st, revs = stageReviewers(st), box = document.getElementById('simp-preview');
  const hdrOpts = cur => `<option value="">（不匯入）</option>` + SIMP.allHeaders.map(h => `<option value="${esc(h)}" ${h === cur ? 'selected' : ''}>${esc(h.replace(/\n/g, ' '))}</option>`).join('');
  const missCrit = stageCriteria(st).filter(c => !SIMP.map['crit:' + c.id]);
  box.innerHTML = `
    <div class="adm-card" style="margin-top:12px;box-shadow:none"><div class="adm-card-hdr"><div class="adm-card-title">① 欄位對應</div>
      <span class="adm-hint">系統先猜好，請確認；確認匯入後會記住，下次自動套用</span></div>
      <div class="adm-card-body adm-grid" style="grid-template-columns:repeat(2,1fr)">
        ${gridKeys(st).map(k => `<div class="frow"><label class="flabel">${esc(keyLabel(k))}</label>
          <select class="fselect" onchange="SIMP.map['${k}']=this.value;buildScoreDiff();drawScoreImport()">${hdrOpts(SIMP.map[k])}</select></div>`).join('')}
      </div>
      ${missCrit.length ? `<div class="adm-warn" style="margin:0 18px 14px">「${missCrit.map(c => esc(c.name)).join('、')}」沒有對應欄位，這些分數不會匯入。</div>` : ''}
    </div>
    <div class="adm-card" style="box-shadow:none"><div class="adm-card-hdr"><div class="adm-card-title">② 工作表與委員</div></div>
      <div class="adm-card-body">
        ${SIMP.dupRev.length ? '<div class="adm-warn">有兩個以上的工作表對應到同一位委員，請確認。</div>' : ''}
        ${SIMP.sheets.map((sh, si) => {
          const chg = sh.items.filter(x => x.from !== ''), add = sh.items.filter(x => x.from === '');
          return `<div style="border:1px solid var(--cr2);border-radius:8px;padding:10px 12px;margin-bottom:10px">
            <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
              <b>${esc(sh.sheet)}</b><span class="adm-hint">${esc(sh.file)}</span>
              <span style="margin-left:auto">對應委員：</span>
              <select class="fselect" style="width:auto" onchange="SIMP.sheets[${si}].revId=this.value;buildScoreDiff();drawScoreImport()">
                <option value="">（不匯入這個工作表）</option>${revs.map(r => `<option value="${r.id}" ${r.id === sh.revId ? 'selected' : ''}>${esc((r.code ? r.code + ' ' : '') + reviewerName(r))}</option>`).join('')}</select>
            </div>
            ${!sh.revId ? '<div class="adm-hint">未對應委員，不匯入。</div>' : `
            <div class="adm-imp-sum"><span>新增 <b>${add.length}</b></span><span>修改 <b>${chg.length}</b></span><span>無變更 <b>${sh.same}</b></span><span>空白略過 <b>${sh.blank}</b></span>
              ${sh.errors.length ? `<span style="background:#FEE;border-color:#FCC">有問題 <b style="color:var(--red)">${sh.errors.length}</b></span>` : ''}</div>
            ${chg.length ? `<div class="adm-warn" style="margin-bottom:6px">已有資料、內容不同的 ${chg.length} 格：預設用新值，取消勾選就保留舊值。</div>
              <div class="tbl-wrap adm-mini" style="max-height:30vh"><table><thead><tr><th style="width:36px"></th><th>考生編號</th><th>姓名</th><th>欄位</th><th>舊值</th><th>新值</th></tr></thead><tbody>
              ${sh.items.map((x, ii) => x.from === '' ? '' : `<tr><td><input type="checkbox" ${x.use ? 'checked' : ''} onchange="SIMP.sheets[${si}].items[${ii}].use=this.checked;updateScoreImportFoot()"></td>
                <td class="mono">${esc(x.app.exam_no)}</td><td>${esc(x.app.name)}</td><td>${esc(keyLabel(x.k))}</td><td><s>${esc(x.from)}</s></td><td><b>${esc(x.to)}</b></td></tr>`).join('')}
              </tbody></table></div>` : ''}
            ${sh.errors.length ? `<details class="adm-skip"><summary>有問題、不會匯入（${sh.errors.length}）</summary><div class="adm-hint">${sh.errors.map(esc).join('<br>')}</div></details>` : ''}`}
          </div>`; }).join('')}
      </div></div>`;
  box.querySelectorAll('.tbl-wrap table').forEach((t, i) => makeSortable(t, 'simp-' + i, [0]));
  updateScoreImportFoot();
}
function scoreImportSelection() { return SIMP ? SIMP.sheets.filter(sh => sh.revId).flatMap(sh => sh.items.filter(x => x.use).map(x => ({ ...x, revId: sh.revId }))) : []; }
function updateScoreImportFoot() {
  const sel = scoreImportSelection(), btn = document.getElementById('simp-btn');
  btn.disabled = !sel.length || SIMP.dupRev.length > 0;
  document.getElementById('simp-foot').textContent = SIMP.dupRev.length ? '同一位委員對應到多個工作表，無法匯入'
    : sel.length ? `將寫入 ${sel.length} 格（分數 ${sel.filter(x => x.k.startsWith('crit:')).length}、研究類型／評語 ${sel.filter(x => !x.k.startsWith('crit:')).length}）` : '沒有需要寫入的資料';
}

async function confirmScoreImport() {
  const sel = scoreImportSelection(), st = SIMP.st;
  if (!sel.length || !gridEditable(st)) return;
  const btn = document.getElementById('simp-btn');
  btn.disabled = true; btn.textContent = '匯入中…';
  try {
    // 1. 分數
    const scoreRows = sel.filter(x => x.k.startsWith('crit:')).map(x => ({
      round_id: CUR.id, applicant_id: x.app.id, reviewer_id: x.revId, criterion_id: x.k.slice(5), score: x.to, source: 'import' }));
    for (let i = 0; i < scoreRows.length; i += 300) {
      const chunk = scoreRows.slice(i, i + 300);
      assertRows(await sb.from('adm_scores').upsert(chunk, { onConflict: 'applicant_id,reviewer_id,criterion_id' }).select('id'), chunk.length, '寫入分數');
    }
    // 2. 研究類型／評語（同一位考生×委員合併成一筆，沒選的欄位保留原值）
    const cmMap = {};
    sel.filter(x => !x.k.startsWith('crit:')).forEach(x => {
      const key = ckey(x.app.id, x.revId), cur = CM[key] || {};
      cmMap[key] = cmMap[key] || { round_id: CUR.id, applicant_id: x.app.id, reviewer_id: x.revId, comment: cur.comment || null, research_tag: cur.research_tag || null };
      if (x.k === 'tag') cmMap[key].research_tag = String(x.to); else cmMap[key].comment = String(x.to);
    });
    const cmRows = Object.values(cmMap);
    for (let i = 0; i < cmRows.length; i += 300) {
      const chunk = cmRows.slice(i, i + 300);
      assertRows(await sb.from('adm_comments').upsert(chunk, { onConflict: 'applicant_id,reviewer_id' }).select('id'), chunk.length, '寫入研究類型／評語');
    }
    // 3. 記住欄位對應（評分項目的 import_label）
    for (const c of stageCriteria(st)) {
      const lbl = SIMP.map['crit:' + c.id] ? normHdr(SIMP.map['crit:' + c.id]) : null;
      if (lbl && lbl !== c.import_label) {
        assertRows(await sb.from('adm_criteria').update({ import_label: lbl }).eq('id', c.id).select('id'), 1, '記住欄位對應');
        c.import_label = lbl;
      }
    }
    // 4. 操作記錄：每位委員一筆
    for (const sh of SIMP.sheets.filter(x => x.revId)) {
      const mine = sel.filter(x => x.revId === sh.revId);
      if (!mine.length) continue;
      const rev = stageReviewers(st).find(r => r.id === sh.revId);
      await writeAuditLog('招生', `匯入${STAGE_ZH[st]}分數`, 'adm_scores', CUR.id, `${CUR.code} ${rev ? reviewerName(rev) : ''}`,
        `檔案 ${sh.file}／工作表 ${sh.sheet}：寫入 ${mine.length} 格（新增 ${mine.filter(x => x.from === '').length}、修改 ${mine.filter(x => x.from !== '').length}）；保留舊值 ${sh.items.filter(x => !x.use).length}；有問題 ${sh.errors.length}`);
    }
    closeModal('simp-modal');
    showToast(`✅ 已匯入 ${sel.length} 格`);
    await loadRound(CUR.id);
    await renderScoresPage(st);
  } catch (e) {
    console.error(e);
    showToast('匯入失敗：' + (e.message || e), 'error');
  } finally { btn.disabled = false; btn.textContent = '確認匯入'; }
}

/* ════════════════════════════════════════════════════════════════
   書審彙整（第 6 批）：書審成績、總排名、門檻判定、研究類型定案、鎖定、書審總表、回填檢核清單
   書審成績＝各項目「有給分委員」的平均 × 權重後加總，四捨五入到梯次設定的小數位數
   ════════════════════════════════════════════════════════════════ */
// 競賽排名（同分同名次：1,2,2,4）
function rankMap(pairs) {
  const vals = pairs.filter(p => p.v != null).map(p => p.v).sort((a, b) => b - a), m = {};
  pairs.forEach(p => { m[p.id] = p.v == null ? null : vals.indexOf(p.v) + 1; });
  return m;
}
function reviewStatus(total) {
  if (total == null) return 'miss';
  if (CUR.pass_threshold == null) return 'pass';
  return total >= Number(CUR.pass_threshold) ? 'pass' : 'fail';
}
const REVIEW_STATUS_ZH = { pass: '進入面試', fail: '未達門檻', miss: '分數未齊' };
// 委員填的研究類型：多數決；平手或沒人填 → ''
function majorityTag(appId) {
  const cnt = {};
  stageReviewers('review').forEach(r => { const t = (CM[ckey(appId, r.id)] || {}).research_tag; if (t) cnt[t] = (cnt[t] || 0) + 1; });
  const arr = Object.entries(cnt).sort((a, b) => b[1] - a[1]);
  if (!arr.length || (arr[1] && arr[1][1] === arr[0][1])) return '';
  return arr[0][0];
}
function reviewerTags(appId) {
  return stageReviewers('review').map(r => ({ r, t: (CM[ckey(appId, r.id)] || {}).research_tag || '' }));
}
// 整理每位考生的彙整資料（畫面、Excel、列印、檢核清單共用）
function buildSummary() {
  const st = 'review', revs = stageReviewers(st), crit = stageCriteria(st);
  const rows = [...APPS].sort((a, b) => String(a.exam_no).localeCompare(String(b.exam_no))).map(a => {
    const res = applicantStageScore(st, a.id);
    return { a, total: res.total, avgs: crit.map(c => res.avgs[c.id] != null ? round2(res.avgs[c.id]) : null),
             ws: revs.map(r => reviewerWeighted(st, a.id, r.id)), spread: reviewerSpread(st, a.id), status: reviewStatus(res.total) };
  });
  const tr = rankMap(rows.map(x => ({ id: x.a.id, v: x.total })));
  const rr = revs.map((r, i) => rankMap(rows.map(x => ({ id: x.a.id, v: x.ws[i] }))));
  rows.forEach(x => {
    x.rank = tr[x.a.id];
    x.revRanks = rr.map(m => m[x.a.id]);
    x.revRankStr = x.revRanks.map(v => v ?? '－').join('-');
    // 委員缺分（有分數未齊的委員）
    x.missCells = revs.reduce((n, r) => n + crit.filter(c => { const v = SC[skey(x.a.id, r.id, c.id)]; return !v || v.score == null; }).length, 0);
  });
  return { revs, crit, rows };
}
function revCode(r, i) { return r.code || String.fromCharCode(65 + i); }

async function renderSummaryPage() {
  const c = document.getElementById('content');
  if (!CUR) { c.innerHTML = '<div class="adm-placeholder">請先在「梯次設定」建立梯次。</div>'; return; }
  c.innerHTML = '<div class="adm-placeholder">讀取中…</div>';
  if (!(await loadStageData('review'))) return;
  drawSummaryPage();
}

  const { revs, crit, rows } = buildSummary();

  if (!crit.length) problems.push('尚未設定書審評分項目');
  if (!revs.length) problems.push('尚未設定書審委員');
  const n = k => rows.filter(x => x.status === k).length;
  const spreadN = rows.filter(x => x.spread != null && x.spread > Number(CUR.spread_alert || 15)).length;
  const missCellN = rows.reduce((t, x) => t + x.missCells, 0);
  const noTag = rows.filter(x => x.status === 'pass' && !x.a.research_tag).length;
  c.innerHTML = `
  <div class="page-hdr">
    <div class="page-title">書審彙整 <span style="font-size:14px;color:var(--ink3)">${esc(CUR.code)} · ${esc(CUR.name)}</span></div>
    <span class="adm-lock ${locked ? 'on' : ''}">${locked ? '🔒 書審已鎖定 ' + esc(fmtTime(CUR.review_locked_at)) : '書審未鎖定'}</span>
  </div>
  ${problems.length ? `<div class="adm-warn">無法彙整：${problems.map(esc).join('、')}。</div>` : `
  <div class="adm-stats">
    <div class="adm-stat"><b>${n('pass')}</b>位進入面試（門檻 ≥ ${esc(CUR.pass_threshold ?? '未設')}）</div>
    <div class="adm-stat"><b>${n('fail')}</b>位未達門檻</div>
    <div class="adm-stat"><b style="color:${n('miss') ? 'var(--red)' : 'var(--navy)'}">${n('miss')}</b>位分數未齊</div>
    <div class="adm-stat"><b style="color:${missCellN ? 'var(--red)' : 'var(--navy)'}">${missCellN}</b>格委員分數空白</div>
    <div class="adm-stat"><b style="color:${spreadN ? 'var(--red)' : 'var(--navy)'}">${spreadN}</b>位委員給分差距 > ${esc(CUR.spread_alert ?? 15)} 分</div>
    <div class="adm-stat"><b>${noTag}</b>位進入面試者研究類型未定</div>
  </div>
  <div class="toolbar">
    ${locked
      ? `<button class="btn btn-sec adm-write" onclick="unlockReview()">🔓 解除鎖定</button>`
      : `<button class="btn btn-pri adm-write" onclick="lockReview()">🔒 鎖定書審成績</button>`}
    <button class="btn btn-sec adm-write" onclick="fillMajorityTags()">帶入多數研究類型</button>
    <button class="btn btn-sec" onclick="downloadSummaryExcel()">⬇ 書審總表 Excel</button>
    <button class="btn btn-sec" onclick="printSummary()">🖨 列印書審總表</button>
    <button class="btn btn-sec" onclick="downloadChecklist()">⬇ 回填檢核清單</button>
  </div>
  <div class="adm-hint" style="margin-bottom:6px">書審成績＝各項目「有給分委員」的平均 × 權重後加總，四捨五入到小數 ${esc(CUR.decimals ?? 2)} 位。${revs.map((r, i) => `${esc(revCode(r, i))}＝${esc(reviewerName(r))}`).join('、')}。研究類型可直接輸入或從委員填的類型挑選，會用在面試分組。</div>
  <datalist id="tag-list">${[...new Set(Object.values(CM).map(m => m.research_tag).concat(APPS.map(a => a.research_tag)).filter(Boolean))].sort().map(t => `<option value="${esc(t)}">`).join('')}</datalist>
  <div class="tbl-wrap"><table id="sum-tbl">
    <thead><tr><th>考生編號</th><th>姓名</th>
      ${crit.map(x => `<th style="text-align:center">${wPct(x.weight)}%${esc(x.name)}<br><span style="font-weight:400;font-size:11px">委員平均</span></th>`).join('')}
      <th style="text-align:center">書審成績</th><th style="text-align:center">總排名</th><th>結果</th>
      ${revs.map((r, i) => `<th style="text-align:center" title="${esc(reviewerName(r))}">${esc(revCode(r, i))}</th>`).join('')}
      <th style="text-align:center">各委員排名</th><th style="text-align:center">差距</th>
      <th>研究類型（定案）</th><th>委員填的研究類型</th><th>書審備註（基本背景）</th></tr></thead>
    <tbody>${rows.map(x => {
      const over = x.spread != null && x.spread > Number(CUR.spread_alert || 15);
      const tags = reviewerTags(x.a.id).filter(t => t.t);
      const diff = new Set(tags.map(t => t.t)).size > 1;
      return `<tr>
      <td class="mono" style="white-space:nowrap">${esc(x.a.exam_no)}</td><td style="white-space:nowrap">${esc(x.a.name)}</td>
      ${x.avgs.map(v => `<td class="adm-calc" data-sort="${v ?? ''}">${fmtN(v)}</td>`).join('')}
      <td class="adm-calc" data-sort="${x.total ?? ''}" style="font-size:14px">${fmtN(x.total)}</td>
      <td class="adm-calc" data-sort="${x.rank ?? ''}">${x.rank ?? ''}</td>
      <td class="adm-${x.status}" data-sort="${{ pass: 1, fail: 2, miss: 3 }[x.status]}">${x.status === 'pass' ? '✓ ' : ''}${REVIEW_STATUS_ZH[x.status]}${x.missCells && x.status !== 'miss' ? `<span class="adm-tags">（缺 ${x.missCells} 格）</span>` : ''}</td>
      ${x.ws.map(v => `<td style="text-align:center" data-sort="${v ?? ''}">${v == null ? '<span class="adm-miss">－</span>' : fmtN(v)}</td>`).join('')}
      <td style="text-align:center;white-space:nowrap">${esc(x.revRankStr)}</td>
      <td class="${over ? 'adm-spread' : ''}" style="text-align:center" data-sort="${x.spread ?? ''}">${fmtN(x.spread)}</td>
      <td data-sort="${esc(x.a.research_tag || '')}"><input class="adm-cell txt" list="tag-list" ${w ? '' : 'disabled'} data-app="${x.a.id}" value="${esc(x.a.research_tag || '')}" data-old="${esc(x.a.research_tag || '')}"
        placeholder="${esc(majorityTag(x.a.id))}" onchange="saveResearchTag(this)" onkeydown="cellKey(event)"></td>
      <td class="adm-tags" ${diff ? 'style="color:var(--gold,#B8860B)"' : ''}>${tags.map(t => esc(revCode(t.r, stageReviewers('review').indexOf(t.r)) + ' ' + t.t)).join('／')}</td>
      <td style="font-size:12px">${esc(backgroundOf(x.a))}</td></tr>`; }).join('')}</tbody></table></div>`}`;
  const tbl = document.getElementById('sum-tbl');
  if (tbl) { makeResizable(tbl, 'sum-review'); makeSortable(tbl, 'sum-review'); }
}

async function saveResearchTag(inp) {
  if (!canWrite()) return;
  const v = inp.value.trim(), old = inp.dataset.old, id = inp.dataset.app;
  if (v === old) return;
  inp.classList.remove('bad'); inp.classList.add('saving');
  try {
    assertRows(await sb.from('adm_applicants').update({ research_tag: v || null }).eq('id', id).select('id'), 1, '儲存研究類型');
    const a = APPS.find(x => x.id === id); if (a) a.research_tag = v || null;
    inp.dataset.old = v; inp.closest('td').dataset.sort = v;
    inp.classList.remove('saving'); inp.classList.add('saved'); setTimeout(() => inp.classList.remove('saved'), 900);
    writeAuditLog('招生', '設定研究類型', 'adm_applicants', id, `${a?.exam_no || ''} ${a?.name || ''}`, `${old || '（空白）'} → ${v || '（空白）'}`);
  } catch (e) {
    console.error(e); inp.classList.remove('saving'); inp.classList.add('bad');
    showToast('儲存失敗：' + (e.message || e), 'error');
  }
}

async function fillMajorityTags() {
  if (!canWrite()) return;
  const todo = APPS.filter(a => !a.research_tag).map(a => ({ a, t: majorityTag(a.id) })).filter(x => x.t);
  const tie = APPS.filter(a => !a.research_tag && !majorityTag(a.id) && reviewerTags(a.id).some(t => t.t)).length;
  if (!todo.length) { alert('沒有可帶入的考生。\n\n只會帶入「研究類型（定案）」還空白、而且委員填的類型有多數的考生' + (tie ? `；有 ${tie} 位委員意見平手，請手動選。` : '。')); return; }
  if (!confirm(`將 ${todo.length} 位考生的研究類型（定案）帶入委員填的多數類型。\n已經定案的不會變動${tie ? `；委員意見平手的 ${tie} 位請手動選` : ''}。\n\n確定嗎？`)) return;
  try {
    for (const x of todo) {
      assertRows(await sb.from('adm_applicants').update({ research_tag: x.t }).eq('id', x.a.id).select('id'), 1, '帶入研究類型');
      x.a.research_tag = x.t;
    }
    await writeAuditLog('招生', '帶入多數研究類型', 'adm_applicants', CUR.id, CUR.code, todo.map(x => `${x.a.exam_no}：${x.t}`).join('、'));
    showToast(`✅ 已帶入 ${todo.length} 位`);
  } catch (e) { console.error(e); showToast('帶入失敗：' + (e.message || e), 'error'); }
  drawSummaryPage();
}

async function lockReview() {
  if (!canWrite() || CUR.review_locked_at) return;
  const { rows } = buildSummary();
  const miss = rows.filter(x => x.status === 'miss');
  if (miss.length) { alert(`還有 ${miss.length} 位考生分數未齊，不能鎖定：\n\n${miss.map(x => x.a.exam_no + ' ' + x.a.name).join('\n')}`); return; }
  if (CUR.pass_threshold == null) { alert('尚未設定書審門檻，請先到「梯次設定」設定。'); return; }
  const warn = [];
  const cells = rows.reduce((t, x) => t + x.missCells, 0);
  if (cells) warn.push(`・有 ${cells} 格委員分數空白（這些考生只平均有給分的委員）`);
  const sp = rows.filter(x => x.spread != null && x.spread > Number(CUR.spread_alert || 15));
  if (sp.length) warn.push(`・有 ${sp.length} 位考生委員給分差距超過 ${CUR.spread_alert ?? 15} 分：${sp.map(x => x.a.exam_no).join('、')}`);
  const pass = rows.filter(x => x.status === 'pass').length;
  if (!confirm(`鎖定 ${CUR.code} 書審成績？\n\n進入面試 ${pass} 位、未達門檻 ${rows.length - pass} 位（門檻 ≥ ${CUR.pass_threshold}）。\n${warn.length ? '\n請注意：\n' + warn.join('\n') + '\n' : ''}\n鎖定後書審分數、門檻、書審委員都不能修改；要修改需先解除鎖定。`)) return;
  try {
    const ts = new Date().toISOString();
    assertRows(await sb.from('adm_rounds').update({ review_locked_at: ts }).eq('id', CUR.id).is('review_locked_at', null).select('id'), 1, '鎖定書審');
    CUR.review_locked_at = ts; const r = ROUNDS.find(x => x.id === CUR.id); if (r) r.review_locked_at = ts;
    await writeAuditLog('招生', '鎖定書審成績', 'adm_rounds', CUR.id, CUR.code, `進入面試 ${pass} 位、未達門檻 ${rows.length - pass} 位、門檻 ${CUR.pass_threshold}`);
    showToast('🔒 書審成績已鎖定');
  } catch (e) { console.error(e); showToast('鎖定失敗：' + (e.message || e), 'error'); }
  drawSummaryPage();
}

async function unlockReview() {
  if (!canWrite() || !CUR.review_locked_at) return;
  if (CUR.admission_locked_at) { alert('錄取名單已鎖定，不能解除書審鎖定。'); return; }
  const reason = prompt('解除書審鎖定後，分數、門檻、書審委員都可以再修改，進入面試名單可能改變。\n\n請輸入解除原因（會記在操作記錄）：');
  if (reason == null) return;
  if (!reason.trim()) { alert('請輸入解除原因。'); return; }
  try {
    assertRows(await sb.from('adm_rounds').update({ review_locked_at: null }).eq('id', CUR.id).select('id'), 1, '解除書審鎖定');
    CUR.review_locked_at = null; const r = ROUNDS.find(x => x.id === CUR.id); if (r) r.review_locked_at = null;
    await writeAuditLog('招生', '解除書審鎖定', 'adm_rounds', CUR.id, CUR.code, '原因：' + reason.trim());
    showToast('🔓 已解除書審鎖定');
  } catch (e) { console.error(e); showToast('解除失敗：' + (e.message || e), 'error'); }
  drawSummaryPage();
}

/* ── 書審總表（Excel／列印）── */
function summaryHead(revs, crit) {
  return ['考生編號', '姓名', ...crit.map(x => `${wPct(x.weight)}%${x.name}\n(委員平均)`), '書審\n成績', '總\n排名', '結果',
          ...revs.map((r, i) => `委員\n${revCode(r, i)}`), '各委員\n排名', '研究類型', '書審備註（基本背景）'];
}
function summaryVals(x) {
  return [x.a.exam_no, x.a.name, ...x.avgs, x.total, x.rank, REVIEW_STATUS_ZH[x.status], ...x.ws, x.revRankStr, x.a.research_tag || '', backgroundOf(x.a)];
}
function summaryNote() {
  return `※ 書審成績＝各項目委員平均（只平均有給分的委員）× 權重後加總，四捨五入至小數 ${CUR.decimals ?? 2} 位；書審成績 ≥ ${CUR.pass_threshold} 分進入面試。`
    + (CUR.review_locked_at ? '' : ' 【書審尚未鎖定，本表僅供參考】');
}
function revLegend(revs) { return '書審委員：' + revs.map((r, i) => `${revCode(r, i)} ${reviewerName(r)}`).join('、'); }
function stamp() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }

async function downloadSummaryExcel() {
  try {
    await ensureExcelJS();
    const { revs, crit, rows } = buildSummary();
    const head = summaryHead(revs, crit), nCol = head.length;
    const nCrit = crit.length, nRev = revs.length;
    const iTotal = 3 + nCrit, iStatus = iTotal + 2, iRevStart = iStatus + 1, iBg = nCol;
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet('書審總表', { pageSetup: { paperSize: 9, orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0,
      horizontalCentered: true, margins: { left: 0.4, right: 0.4, top: 0.5, bottom: 0.5, header: 0.2, footer: 0.2 } } });
    ws.pageSetup.printTitlesRow = '4:4';
    ws.headerFooter.oddFooter = `&L&"新細明體"&10製表日期：${stamp()}&R&"新細明體"&10第 &P 頁／共 &N 頁`;
    ws.columns = [11, 9, ...crit.map(() => 15), 9, 6, 10, ...revs.map(() => 7.5), 12, 11, 46].map(w => ({ width: w }));
    ws.mergeCells(1, 1, 1, nCol);
    Object.assign(ws.getCell(1, 1), { value: `${formTitle()}總表` });
    ws.getCell(1, 1).font = { ...TPL_FONT, size: 15, bold: true }; ws.getCell(1, 1).alignment = { horizontal: 'center', vertical: 'middle' };
    ws.mergeCells(2, 1, 2, iStatus);
    ws.getCell(2, 1).value = revLegend(revs); ws.getCell(2, 1).font = { ...TPL_FONT, bold: true };
    ws.mergeCells(2, iRevStart, 2, nCol);
    const pass = rows.filter(x => x.status === 'pass').length;
    ws.getCell(2, iRevStart).value = `考生共 ${rows.length} 位，進入面試 ${pass} 位`;
    ws.getCell(2, iRevStart).font = TPL_FONT; ws.getCell(2, iRevStart).alignment = { horizontal: 'right' };
    ws.mergeCells(3, 1, 3, nCol);
    ws.getCell(3, 1).value = summaryNote(); ws.getCell(3, 1).font = { ...TPL_FONT, size: 11, color: CUR.review_locked_at ? undefined : { argb: 'FFC00000' } };
    const hr = ws.getRow(4);   // 列高交給 Excel 自動調整
    head.forEach((h, i) => {
      const c = hr.getCell(i + 1);
      c.value = h; c.font = { ...TPL_FONT, bold: true }; c.border = TPL_BORDER;
      c.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
      c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEEEEEE' } };
    });
    const dec = CUR.decimals ?? 2, numFmt = dec ? '0.' + '0'.repeat(dec) : '0';
    rows.forEach((x, k) => {
      const row = ws.getRow(5 + k);
      summaryVals(x).forEach((v, i) => {
        const col = i + 1, c = row.getCell(col);
        c.value = v ?? null; c.border = TPL_BORDER;
        c.font = col === iBg ? { ...TPL_FONT, size: 11 } : col === iTotal ? { ...TPL_FONT, bold: true } : TPL_FONT;
        const isNum = (col >= 3 && col <= iTotal) || (col >= iRevStart && col < iRevStart + nRev);
        if (isNum && v != null) c.numFmt = numFmt;
        c.alignment = { vertical: 'middle', horizontal: col <= 2 || col >= nCol - 1 ? 'left' : 'center', wrapText: col === iBg };
        if (col === iStatus && x.status !== 'pass') c.font = { ...TPL_FONT, color: { argb: x.status === 'miss' ? 'FFC00000' : 'FF808080' } };
      });
      if (x.status === 'pass') [1, 2, iTotal, iStatus].forEach(col => { row.getCell(col).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEAF4EA' } }; });
    });
    const sr = 5 + rows.length + 2;
    ws.mergeCells(sr, 1, sr, nCol);
    ws.getCell(sr, 1).value = '承辦人：＿＿＿＿＿＿＿＿' + ' '.repeat(10) + '單位主管：＿＿＿＿＿＿＿＿' + ' '.repeat(10) + '日期：＿＿＿＿年＿＿月＿＿日';
    ws.getCell(sr, 1).font = { ...TPL_FONT, size: 13 }; ws.getCell(sr, 1).alignment = { horizontal: 'right' };
    const buf = await wb.xlsx.writeBuffer();
    saveBlob(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), `${CUR.code}_書審總表${CUR.review_locked_at ? '' : '_未鎖定'}.xlsx`);
    writeAuditLog('招生', '下載書審總表 Excel', 'adm_rounds', CUR.id, CUR.code, `考生 ${rows.length} 位、進入面試 ${pass} 位${CUR.review_locked_at ? '' : '（未鎖定）'}`);
  } catch (e) { console.error(e); showToast('產生書審總表失敗：' + (e.message || e), 'error'); }
}

function printSummary() {
  const { revs, crit, rows } = buildSummary();
  const head = summaryHead(revs, crit), pass = rows.filter(x => x.status === 'pass').length;
  const iTotal = 2 + crit.length, iStatus = iTotal + 2, iBg = head.length - 1;
  const css = [
    '@page{size:A4 landscape;margin:10mm}',
    'body{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#000;margin:0;font-size:10pt}',
    'h1{font-size:15pt;text-align:center;margin:0 0 4px}',
    '.meta{display:flex;justify-content:space-between;margin-bottom:2px;font-size:10.5pt}',
    '.note{font-size:9.5pt;margin-bottom:5px}.note.draft{color:#C00000}',
    'table{width:100%;border-collapse:collapse}thead{display:table-header-group}tr{page-break-inside:avoid}',
    'th,td{border:1px solid #000;padding:3px 4px;vertical-align:middle}',
    'th{background:#eee;font-size:9pt;text-align:center;line-height:1.25}',
    'td{text-align:center;white-space:nowrap}td.l{text-align:left}td.bg{text-align:left;white-space:normal;font-size:9pt}',
    'td.tot{font-weight:bold}tr.pass td.hl{background:#EAF4EA}td.fail{color:#808080}td.miss{color:#C00000}',
    '.sign{margin-top:14px;text-align:right;font-size:11.5pt}',
  ].join('');
  const body = `<h1>${esc(formTitle())}總表</h1>
    <div class="meta"><b>${esc(revLegend(revs))}</b><span>考生共 ${rows.length} 位，進入面試 ${pass} 位</span></div>
    <div class="note ${CUR.review_locked_at ? '' : 'draft'}">${esc(summaryNote())}</div>
    <table><thead><tr>${head.map(h => `<th>${esc(h).replace(/\n/g, '<br>')}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(x => `<tr class="${x.status}">${summaryVals(x).map((v, i) => {
      if (typeof v === 'number' && ((i >= 2 && i <= iTotal) || (i > iStatus && i <= iStatus + revs.length))) v = v.toFixed(CUR.decimals ?? 2);
      const cls = [i <= 1 ? 'l hl' : '', i === iTotal ? 'tot hl' : '', i === iStatus ? 'hl ' + x.status : '', i === iBg ? 'bg' : '', i === iBg - 1 ? 'l' : ''].join(' ').trim();
      return `<td class="${cls}">${esc(v ?? '')}</td>`; }).join('')}</tr>`).join('')}</tbody></table>
    <div class="sign">承辦人：＿＿＿＿＿＿&emsp;&emsp;單位主管：＿＿＿＿＿＿&emsp;&emsp;日期：＿＿＿年＿＿月＿＿日</div>`;
  const html = '<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><title>' + esc(CUR.code) + ' 書審總表</title><sty' + 'le>' + css + '</sty' + 'le></he' + 'ad><bo' + 'dy>'
    + body + '<scr' + 'ipt>window.onload=()=>window.print()<\/scr' + 'ipt></bo' + 'dy></ht' + 'ml>';
  const w = window.open('', '_blank');
  if (!w) { showToast('瀏覽器擋住了新視窗，請允許彈出視窗後再試', 'error'); return; }
  w.document.write(html); w.document.close();
  writeAuditLog('招生', '列印書審總表', 'adm_rounds', CUR.id, CUR.code, `考生 ${rows.length} 位、進入面試 ${pass} 位${CUR.review_locked_at ? '' : '（未鎖定）'}`);
}

/* ── 報名系統回填檢核清單：報名系統不能批次匯入，承辦人逐筆輸入後打勾、再由第二人核對 ── */
async function downloadChecklist() {
  try {
    if (!CUR.review_locked_at && !confirm('書審成績尚未鎖定，清單上的成績可能還會變動。\n\n仍要產生嗎？（表頭會註明「未鎖定」）')) return;
    await ensureExcelJS();
    const { rows } = buildSummary();
    const head = ['序', '考生編號', '姓名', '書審成績', '書審結果', '已輸入\n報名系統', '核對\n無誤', '備註'];
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet('回填檢核（書審）', { pageSetup: { paperSize: 9, orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0,
      horizontalCentered: true, margins: { left: 0.5, right: 0.5, top: 0.5, bottom: 0.5, header: 0.2, footer: 0.2 } } });
    ws.pageSetup.printTitlesRow = '4:4';
    ws.headerFooter.oddFooter = `&L&"新細明體"&10製表日期：${stamp()}&R&"新細明體"&10第 &P 頁／共 &N 頁`;
    ws.columns = [5, 12, 10, 10, 10, 10, 10, 30].map(w => ({ width: w }));
    ws.mergeCells(1, 1, 1, 8);
    ws.getCell(1, 1).value = `${formTitle()}成績\n報名系統回填檢核清單`;
    ws.getCell(1, 1).font = { ...TPL_FONT, size: 14, bold: true }; ws.getCell(1, 1).alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
    ws.getRow(1).height = 40;
    ws.mergeCells(2, 1, 2, 8);
    ws.getCell(2, 1).value = `梯次 ${CUR.code} 考生共 ${rows.length} 位 進入面試 ${rows.filter(x => x.status === 'pass').length} 位 門檻 ≥ ${CUR.pass_threshold}`
      + (CUR.review_locked_at ? ` （書審已鎖定 ${fmtTime(CUR.review_locked_at)}）` : ' 【書審尚未鎖定】');
    ws.getCell(2, 1).font = { ...TPL_FONT, size: 11, color: CUR.review_locked_at ? undefined : { argb: 'FFC00000' } };
    ws.mergeCells(3, 1, 3, 8);
    ws.getCell(3, 1).value = '※ 逐筆輸入報名系統後在「已輸入」打 ✓；再由另一位同仁對照報名系統畫面逐筆核對，在「核對無誤」打 ✓。';
    ws.getCell(3, 1).font = { ...TPL_FONT, size: 11 }; ws.getCell(3, 1).alignment = { wrapText: true, vertical: 'middle' };
    ws.getRow(3).height = 32;
    const hr = ws.getRow(4);
    head.forEach((h, i) => {
      const c = hr.getCell(i + 1);
      c.value = h; c.font = { ...TPL_FONT, bold: true }; c.border = TPL_BORDER;
      c.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
      c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEEEEEE' } };
    });
    const dec = CUR.decimals ?? 2, numFmt = dec ? '0.' + '0'.repeat(dec) : '0';
    rows.forEach((x, k) => {
      const row = ws.getRow(5 + k);
      [k + 1, x.a.exam_no, x.a.name, x.total, x.status === 'pass' ? '通過' : x.status === 'fail' ? '未通過' : '分數未齊', '□', '□', ''].forEach((v, i) => {
        const c = row.getCell(i + 1);
        c.value = v ?? null; c.border = TPL_BORDER; c.font = i === 5 || i === 6 ? { ...TPL_FONT, size: 14 } : TPL_FONT;
        c.alignment = { vertical: 'middle', horizontal: i === 1 || i === 2 || i === 7 ? 'left' : 'center' };
        if (i === 3 && v != null) c.numFmt = numFmt;
      });
    });
    const sr = 5 + rows.length + 2;
    ws.mergeCells(sr, 1, sr, 8);
    ws.getCell(sr, 1).value = '輸入人：＿＿＿＿＿＿ 日期：＿＿／＿＿  核對人：＿＿＿＿＿＿ 日期：＿＿／＿＿';
    ws.getCell(sr, 1).font = { ...TPL_FONT, size: 12 }; ws.getCell(sr, 1).alignment = { horizontal: 'right' };
    const buf = await wb.xlsx.writeBuffer();
    saveBlob(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), `${CUR.code}_報名系統回填檢核清單_書審${CUR.review_locked_at ? '' : '_未鎖定'}.xlsx`);
    writeAuditLog('招生', '下載回填檢核清單（書審）', 'adm_rounds', CUR.id, CUR.code, `考生 ${rows.length} 位${CUR.review_locked_at ? '' : '（未鎖定）'}`);
  } catch (e) { console.error(e); showToast('產生檢核清單失敗：' + (e.message || e), 'error'); }
}

checkAuth();
</script>
</body>
</html>
